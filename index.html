 segnala un problema su C0471. Che cosa, in questo evento, porta ai lotti di yogurt?","opts":[{"t":"L'ilmd del lotto L123, dove la trasformazione riporta il lotto di latte usato","why":"L'ILMD porta i dati anagrafici del lotto prodotto, come la scadenza. La genealogia la danno input e output."},{"t":"Il readPoint vasca1: una query per luogo restituisce tutto quello che è passato in vasca","why":"Per luogo trovi anche lotti fatti con altro latte. Il legame preciso lo danno input e output dello stesso evento."},{"t":"inputQuantityList con il lotto C0471 e outputQuantityList con il lotto L123, nello stesso evento","ok":true,"why":"Esatto. Input e output nello stesso evento danno la genealogia nelle due direzioni, per lotti e quantità."},{"t":"Il transformationID, senza il quale input e output dell'evento non restano collegati","why":"Il transformationID serve quando input e output stanno in eventi diversi. Qui sono nello stesso evento."}],"events":["Trasformazione: latte e fermenti diventano 288 vasetti del lotto L123"],"fact":"Un <code>TransformationEvent</code> collega gli ingredienti (input) al prodotto (output). Non ha <code>action</code>: non aggiunge e non toglie, trasforma. Da qui puoi sempre risalire al latte di partenza.","power":["Albero genealogico","Da ogni lotto risali ai suoi ingredienti, e da ogni ingrediente ai lotti in cui è finito."],"why":{"benefit":"Se un ingrediente ha un problema, sai subito quali lotti di prodotto finito lo contengono. Lo vedrai nella sfida finale.","who":["produttore","autorita"]},"notes":{"ask":"Se domani scoprite un problema su una cisterna di latte, quali prodotti finiti dovete fermare?","answer":"Tutti i lotti fatti con quel latte, e solo quelli. Senza il legame ingredienti-prodotto si ferma tutto per prudenza.","story":"Il TransformationEvent è il pezzo che manca a molti sistemi: registra cosa entra e cosa esce, quindi il legame si ritrova anche dopo mesi.","link":"Con le aziende di trasformazione è un buon aggancio. È il dato che serve per richiami mirati e per l'origine degli ingredienti."},"hint":"Chiediti che cosa viene consumato per fare il lotto, e con quale chiave GS1 lo identifichi.","sceneDesc":"Scena: la vasca del caseificio. Intorno ci sono latte, fermenti, un pallet vuoto e un detergente. Quello che metti nella vasca compare nell'elenco."},"food-nascita":{"meta":{"t":"Nasce il vasetto","c":"Le dimensioni di un evento","place":"Caseificio · linea 2"},"intro":"Il lotto L123 è nato nella vasca. Adesso passa il controllo qualità sulla linea 2. Scriviamo la sua carta d'identità.","story":"Ogni evento EPCIS è una frase che risponde a poche domande. Componi questa pagina del diario: scegli una risposta per ogni riga.","cap":"Lotto L123 · 288 vasetti · scadenza 30/11","rows":[{"d":"COSA","o":["epcClass …/01/09506000134352/10/L123","epc …/01/09506000134352/10/L123","epc …/01/09506000134352/21/L123"],"ok":0,"why":"Un lotto è una classe: va in quantityList come epcClass. In epcList vanno solo istanze, e L123 non è un numero di serie (AI 21)."},{"d":"QUANDO","o":["recordTime 2026-11-02T08:15:00+01:00","eventTime 2026-11-02T08:15:00+01:00","eventTime 2026-11-02T08:15:00Z"],"ok":1,"why":"Serve l'istante del controllo con il suo fuso: eventTime con +01:00. Il recordTime lo scrive il repository; le 08:15Z sono le 09:15 italiane."},{"d":"DOVE","o":["readPoint …/414/0614141007776 · bizLocation …/254/linea2","readPoint …/254/linea2 · bizLocation GLN del CeDi","readPoint …/254/linea2 · bizLocation …/414/0614141007776"],"ok":2,"why":"Il readPoint è il punto del fatto, la linea 2. La bizLocation è dove si trova il lotto dopo l'evento: il caseificio, non il CeDi."},{"d":"PERCHÉ","o":["bizStep commissioning · disposition active","bizStep inspecting · disposition active","bizStep creating_class_instance · disposition active"],"ok":1,"why":"Il lotto è già nato nella trasformazione: commissioning e creating_class_instance descrivono una nascita. Adesso lo stai controllando: inspecting."}],"needAll":"Scegli una risposta per ogni riga.","wrongOne":"Una riga non è comprensibile per gli altri partner. Correggi e riprova.","wrongMany":"{n} righe non sono comprensibili per gli altri partner. Correggi e riprova.","events":["Controllo qualità del lotto L123 sulla linea 2"],"fact":"COSA, QUANDO, DOVE e PERCHÉ, ognuno con una chiave GS1 o un termine standard. Qui <code>action</code> è <code>OBSERVE</code>: il lotto esiste già e lo stai osservando. <code>ADD</code> serve quando qualcosa entra in gioco per la prima volta.","power":["Dna digitale","Ogni lotto ha un'identità GS1 che tutti i partner leggono allo stesso modo."],"why":{"benefit":"Ogni partner legge lo stesso evento allo stesso modo: niente telefonate per capire cosa, dove e quando.","who":["produttore","distribuzione"]},"notes":{"ask":"Se scrivo «Chiedi a Mario» come luogo, chi capisce dove è successo?","answer":"Solo chi conosce Mario. Un GLN invece lo leggono tutti i partner.","story":"Ogni evento risponde sempre alle stesse domande: COSA, QUANDO, DOVE, PERCHÉ. È la grammatica comune della filiera.","link":"Ricorda che GTIN e GLN sono già nei sistemi di molte aziende: EPCIS li riusa, non chiede codici nuovi."},"hint":"Per ogni riga chiediti: un partner di un'altra azienda lo capirebbe? E descrive il fatto, o qualcos'altro?","sceneDesc":"Scena: il caseificio e la linea 2, con il vasetto del lotto L123 sul nastro verso il controllo qualità."},"food-raggi-x":{"meta":{"t":"Vista ai raggi X","c":"AggregationEvent · packing","place":"Caseificio · fine linea"},"intro":"288 vasetti, 12 cartoni, un pallet. Al CeDi (Centro di Distribuzione) nessuno avrà voglia di aprirlo.","story":"Ogni cartone contiene 24 vasetti. Impila i 12 cartoni sul pallet.","stack":"Impila un cartone","stackAll":"Impila tutti","count":"Cartoni {n}/12 · vasetti {j}/288","q":"Il CeDi legge un solo SSCC e conosce lotti e quantità del pallet. Quali eventi lo rendono possibile?","opts":[{"t":"Un AggregationEvent ADD con l'SSCC del pallet come parentID e il lotto L123 nei childEPCs","why":"Un lotto è una classe: va in childQuantityList. Nei childEPCs vanno solo istanze, come gli SSCC dei cartoni."},{"t":"Un ObjectEvent packing con l'SSCC del pallet in epcList e i 288 vasetti in quantityList","why":"L'ObjectEvent dice che gli oggetti erano lì insieme, non che uno contiene l'altro. Il contenimento è un'aggregazione."},{"t":"Un AggregationEvent ADD con il GTIN dei cartoni come parentID e l'SSCC del pallet nei childEPCs","why":"È rovesciato: il contenitore è il pallet. E il parentID è sempre un'istanza, mai una classe come un GTIN."},{"t":"Due AggregationEvent ADD: L123 nei cartoni con childQuantityList, cartoni nel pallet con childEPCs","ok":true,"why":"Esatto. Due livelli di aggregazione: il contenuto vale finché nessuno smonta il pallet senza registrarlo."}],"scan":"Scansiona il pallet","scanned":"Una sola lettura dell'SSCC (Serial Shipping Container Code, il codice del pallet): 12 cartoni e 288 vasetti.","cap":"Pallet · SSCC 106141411234567897","events":["Primo cartone: 24 vasetti del lotto L123 (lo stesso evento si ripete per tutti i 12 cartoni)","Pallet: i 12 cartoni, ognuno con il suo SSCC"],"fact":"Due livelli di aggregazione: 24 vasetti in ogni cartone, 12 cartoni sul pallet. Il <code>parentID</code> è il contenitore, i figli sono il contenuto. <code>action: ADD</code> perché il legame nasce adesso.","power":["Vista ai raggi X","Con l'aggregazione leggi il pallet e sai cosa c'è dentro, senza aprirlo."],"why":{"benefit":"Ricevimento più veloce: leggi un'etichetta e conosci tutto il contenuto, senza aprire il pallet.","who":["distribuzione","produttore"]},"notes":{"ask":"Quanto tempo serve per controllare il contenuto di un pallet al ricevimento?","answer":"Aprendolo, minuti per pallet. Con l'aggregazione basta leggere l'SSCC sull'etichetta.","story":"L'aggregazione si può disfare: quando il CeDi apre il pallet si registra un evento con action DELETE, e i cartoni tornano liberi.","link":"Il ricevimento al CeDi è un punto in cui il vantaggio si vede subito: meno controlli manuali, meno contestazioni."},"hint":"Distingui istanze e classi: che cosa può stare in childEPCs, e che cosa in childQuantityList?","sceneDesc":"Scena: un pallet su cui impilare 12 cartoni da 24 vasetti. Con lo scanner il pallet diventa trasparente e si vedono i 288 vasetti."},"food-cbv":{"meta":{"t":"Le parole non si inventano","c":"Vocabolario CBV · shipping","place":"Caseificio · baia 3"},"intro":"Il pallet parte per il CeDi di Bologna. Il sistema del CeDi deve capire cosa sta succedendo, senza telefonate.","bubble":"Ciao, sono il CeDi di Bologna. Cosa mi state mandando?","bubbleBad":"??? Non conosco questa parola.","bubbleGood":"Ricevuto! Pallet in viaggio, ordine collegato. Vi aspetto.","cap":"IL SISTEMA DEL CeDi ASCOLTA","story":"Il pallet sale sul camion. Ogni azienda ha il suo gergo, ma il sistema del CeDi capisce solo il CBV (Core Business Vocabulary), il vocabolario comune di GS1.","q":"Il gestionale chiama la spedizione «uscita_merce» e lo stato «in_viaggio». Che cosa cambia usando shipping e in_transit del CBV?","opts":[{"t":"Ogni partner interpreta passo e stato con le stesse regole, senza tabelle di conversione per fornitore","ok":true,"why":"Esatto. Un vocabolario comune elimina le traduzioni da sistema a sistema: meno lavoro, meno errori."},{"t":"Nulla di sostanziale: in JSON-LD il contesto EPCIS traduce da solo i valori aziendali in valori CBV","why":"Il contesto espande i termini CBV in URI, ma non sa che cosa voglia dire «uscita_merce». Nessuna traduzione automatica."},{"t":"L'evento supera la validazione: lo schema di EPCIS 2.0 accetta in bizStep solo i valori del CBV","why":"Lo schema accetta anche valori propri, scritti come URI. Il problema è che li capisce solo chi li ha inventati."},{"t":"Con il CBV diventano obbligatori sourceList e destinationList, che con valori aziendali non si usano","why":"Sorgenti e destinazioni restano facoltative e non dipendono dal bizStep. Il CBV ne definisce solo i tipi."}],"events":["Spedizione del pallet dal caseificio al CeDi di Bologna"],"fact":"Il CBV dà i verbi (<code>shipping</code>) e gli stati (<code>in_transit</code>). L'ordine d'acquisto viaggia agganciato all'evento, e con <code>sourceList</code> e <code>destinationList</code> il CeDi sa chi spedisce, chi riceve e dove.","power":["Parla con tutti","Il vocabolario CBV: le stesse parole per ogni sistema della filiera."],"why":{"benefit":"Meno errori e meno telefonate: i sistemi dei partner si capiscono senza traduzioni.","who":["produttore","distribuzione"]},"notes":{"ask":"Quante parole diverse usate in azienda per dire «spedito»?","answer":"Di solito più di una, e cambiano da sistema a sistema.","story":"Il CBV (Core Business Vocabulary) è il vocabolario di GS1: passi di processo come shipping e stati come in_transit sono uguali per tutti.","link":"Quando un'azienda dice «abbiamo già i dati», chiedete se usano parole standard: è lì che si perde l'interoperabilità."},"hint":"Chiediti che cosa fa davvero il contesto JSON-LD, e che cosa accetta lo schema di EPCIS 2.0.","sceneDesc":"Scena: la baia di carico del caseificio con il camion e il CeDi di Bologna sullo sfondo."},"food-freddo":{"meta":{"t":"Catena del freddo","c":"AssociationEvent · sensori","place":"In viaggio verso Bologna"},"intro":"Due ore di autostrada. Prima di partire, sul pallet viene montato un sensore di temperatura. Va collegato all'oggetto giusto.","story":"Il sensore registra la temperatura per tutto il viaggio. Lo yogurt deve restare sotto gli 8 °C.","q1":"Il pallet cambierà camion al CeDi. Perché legare il sensore al pallet con un AssociationEvent?","opts1":[{"t":"Perché solo l'AssociationEvent può contenere una sensorElementList","why":"La sensorElementList può stare in ogni tipo di evento. L'associazione serve a legare il dispositivo alla merce."},{"t":"Perché lega il deviceID del sensore all'SSCC: le misure restano riferite al pallet su ogni mezzo","ok":true,"why":"Esatto. iano dentro l'evento: minimo, massimo, allarmi."],"why":{"benefit":"Chi riceve sa subito se la catena del freddo ha tenuto e può decidere su quel pallet, non su tutto il carico.","who":["distribuzione","consumatore"]},"notes":{"ask":"Se un pallet cambia camion al CeDi, il dato della temperatura dove deve stare?","answer":"Legato al pallet, non al camion. Per questo serve l'AssociationEvent.","story":"EPCIS 2.0 ha portato i dati dei sensori dentro gli eventi: minimo, massimo, allarmi, con unità di misura standard.","link":"Per il fresco e il surgelato è un tema concreto: la prova della catena del freddo viaggia con il prodotto."},"hint":"Pensa a che cosa succede alle misure quando il pallet cambia mezzo.","sceneDesc":"Scena: il camion in autostrada verso Bologna. La temperatura del sensore compare in alto."},"food-errore":{"meta":{"t":"Ops, errore!","c":"Dichiarazione di errore","place":"CeDi di Bologna"},"intro":"Il pallet arriva al CeDi. Una persona del magazzino, stanca, registra il ricevimento...","req":"receiving · lotto <span class=\\"bad\\">L132</span> · 288 pezzi","cap":"Evento già letto da tre partner","story":"Chi registra il ricevimento digita <code>L132</code> invece di <code>L123</code>. L'evento è già stato letto dal caseificio, dall'azienda di trasporto e dalla sede.","q":"Tre partner hanno già letto l'evento con il lotto sbagliato. Come si corregge in EPCIS 2.0?","opts":[{"t":"Si pubblica un evento con lo stesso eventID e il lotto L123: il repository tiene l'ultima versione","why":"<b>Fine partita per la fiducia.</b> Due versioni diverse con lo stesso ID: ogni partner avrebbe una storia diversa."},{"t":"Si pubblica un ObjectEvent con action DELETE sul lotto L132, poi il ricevimento corretto","why":"DELETE descrive un fatto fisico, come lo smontaggio di un pallet. Non annulla un evento."},{"t":"Si ripubblica l'evento identico con errorDeclaration, il motivo e i correctiveEventIDs della correzione","ok":true,"why":"Esatto. La storia resta verificabile: chi ha letto l'evento sbagliato vede l'errore e trova la correzione."},{"t":"Si pubblica il ricevimento corretto con errorDeclaration e, nei correctiveEventIDs, l'evento sbagliato","why":"È rovesciato: la dichiarazione va sull'evento sbagliato, e i correctiveEventIDs puntano all'evento corretto."}],"register":"Registra correzione","events":["L'evento sbagliato (lotto L132) con la dichiarazione di errore","L'evento corretto (lotto L123)"],"fact":"Nel diario restano due pagine: l'evento sbagliato con la sua <code>errorDeclaration</code> (motivo standard <code>incorrect_data</code>) e l'evento corretto, collegato con <code>correctiveEventIDs</code>. Niente sparisce, tutto si spiega.","power":["Memoria onesta","Gli errori si correggono con una dichiarazione, mai cancellando."],"why":{"benefit":"Dati affidabili: ogni correzione è visibile a tutti i partner, con ora e motivo.","who":["produttore","distribuzione","autorita"]},"notes":{"ask":"Cosa succede se cancello un dato che un partner ha già letto?","answer":"Le due storie non tornano più. In EPCIS non si cancella: si dichiara l'errore e si pubblica la correzione.","story":"La dichiarazione di errore conserva l'ora e il motivo: anche la correzione diventa parte della storia.","link":"È un argomento di fiducia: utile con chi teme che condividere dati esponga i propri errori."},"hint":"In EPCIS la storia non si riscrive: si aggiunge qualcosa.","sceneDesc":"Scena: il pallet appena arrivato davanti al CeDi di Bologna."},"tessile-filo":{"meta":{"t":"Dal filo al capo","c":"TransformationEvent a più passaggi","place":"Filiera tessile"},"intro":"Cambio di mondo: stesso standard, altro settore. Una t-shirt nasce da un tessuto, il tessuto da un filo, il filo da una fibra.","story":"Cinque passaggi reali tra fibra e t-shirt. Solo alcuni creano un prodotto nuovo: sono loro a costruire la genealogia.","q":"Scegli in ordine solo i passaggi che sono trasformazioni.","steps":[{"id":"spedizione","t":"Spedizione · il filato va dalla filatura alla tessitura","pos":-1,"why":"Cambia il luogo, non il prodotto: è un ObjectEvent con shipping."},{"id":"tessitura","t":"Tessitura · il filato diventa tessuto","pos":1},{"id":"filatura","t":"Filatura · la fibra di cotone diventa filato","pos":0},{"id":"etichetta","t":"Etichettatura · a ogni t-shirt si applica un tag RFID","pos":-1,"why":"Il capo resta lo stesso: si associa un'etichetta a un oggetto che esiste già."},{"id":"confezione","t":"Confezione · il tessuto diventa 24 t-shirt","pos":2}],"wrong":"Non ancora: ogni trasformazione usa quello che esce dalla trasformazione prima.","chainTitle":"La storia delle t-shirt","chainEmpty":"Scegli il primo passaggio.","done":"La catena è completa: fibra, filato, tessuto, t-shirt.","events":["Filatura: 120 kg di fibra diventano 110 kg di filato","Tessitura: il filato diventa 600 metri di tessuto","Confezione: 36 metri di tessuto diventano 24 t-shirt con numero di serie"],"fact":"Tre <code>TransformationEvent</code> in fila: fibra, filato, tessuto, 24 t-shirt con numero di serie. Ogni output diventa l'input del passaggio dopo. È il filo rosso su cui si costruisce il Passaporto Digitale di Prodotto (DPP).","power":["Filo rosso","Ogni capo porta con sé la storia dei suoi materiali, passaggio dopo passaggio."],"why":{"benefit":"Le informazioni su materiali e lavorazioni seguono il capo. Servono per la sostenibilità e per il Passaporto Digitale di Prodotto previsto dal regolamento europeo ESPR.","who":["produttore","consumatore","autorita"],"source":"Regolamento (UE) 2024/1781 sulla progettazione ecocompatibile dei prodotti sostenibili (ESPR)"},"notes":{"ask":"Da dove viene il cotone della maglietta che indossate?","answer":"Quasi nessuno lo sa: le informazioni si perdono tra filatura, tessitura e confezione.","story":"Gli stessi TransformationEvent del latte funzionano per il tessile: ogni output diventa l'input del passaggio dopo.","link":"Il Passaporto Digitale di Prodotto previsto dal regolamento ESPR rende questo tema ontato due volte."}],"register":"Registra inventario","events":["Inventario: le 24 t-shirt contate una per una"],"fact":"Nella lista ci sono tutti e 24 i numeri di serie: ogni capo è contato uno per uno, senza vederlo. Sono le stesse t-shirt nate nel livello 2-1.","power":["Lettura lampo","Stessa identità EPC, vettore RAIN RFID: uno scaffale intero in un colpo."],"why":{"benefit":"Inventari più veloci e accurati: sai cosa c'è davvero a scaffale e riordini quando serve.","who":["distribuzione","consumatore"],"case":"Decathlon applica un tag EPC/RFID al 100% dei suoi prodotti e usa oltre 50.000 lettori nel mondo. Dichiara un'efficienza dell'inventario cinque volte maggiore.","source":"GS1 US, case study «Global Retail Sporting Goods Leader Finishes First with RFID»"},"notes":{"ask":"Quanto ci mette un negozio a contare a mano tutti i capi?","answer":"Ore, spesso di notte o a negozio chiuso. Con RAIN RFID minuti.","story":"Il tag RFID è solo il mezzo: l'identità è l'EPC, la stessa che può stare in un barcode o in un database.","link":"Caso pubblico: Decathlon applica un tag EPC/RFID al 100% dei suoi prodotti (case study GS1 US, vedi SOURCES.md)."},"hint":"Separa il dato dal mezzo che lo trasporta. E chiediti se il dato identifica un modello o un capo.","sceneDesc":"Scena: uno scaffale con 24 t-shirt e un lettore RFID. I capi letti si accendono, il contatore in basso dice quanti sono."},"tessile-reso":{"meta":{"t":"Il reso sospetto","c":"Storia del capo · pedigree","place":"Negozio di Roma"},"intro":"Due persone riportano lo stesso modello di giubbotto. Nessuna delle due ha lo scontrino.","story":"Negozio di Roma. Due giubbotti identici tornano indietro senza scontrino. Interroga il repository EPCIS, l'archivio degli eventi, e leggi la storia di ciascun numero di serie.","q":"Hai interrogato i due giubbotti. Quale conclusione puoi difendere davanti alla cliente?","jacketA":"Capo A<br>JK-0457","jacketB":"Capo B<br>JK-9999","query":"Interroga","cap":"Stesso GTIN 095060001

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missione L123</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: cabinato arcade a schermo pieno — HUD in alto, schermo CRT al centro, barra comandi in basso. Tema unico scuro, palette GS1 Italy. */
:root {
  --ink: #00102b;
  --screen: #001a45;
  --panel: #002c6c;
  --panel-2: #0a3b85;
  --orange: #f26334;
  --sky: #00b6de;
  --lime: #7ac143;
  --pink: #f05587;
  --gold: #fbb034;
  --white: #f4f7fb;
  --muted: #9fb4d6;
  --danger: #ff5a5f;
  --font-display: "Press Start 2P", "Courier New", monospace;
  --font-body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--white); font-family: var(--font-body); font-size: 24px; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px; font-family: var(--font-display); font-size: clamp(9px, 1.05vw, 13px); letter-spacing: .04em; }
.hud .lbl { color: var(--sky); margin-right: 6px; }
.hud .val { color: var(--white); font-variant-numeric: tabular-nums; }
.hud .lotto { color: var(--gold); }
.hud .hearts { display: inline-flex; gap: 4px; vertical-align: middle; }
.hud .hearts img { width: 18px; height: auto; }
.hud .hearts img.lost { opacity: .18; }
.hud .pw { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.hud .pw span { width: 12px; height: 12px; background: var(--panel-2); border: 2px solid var(--muted); display: inline-block; }
.hud .pw span.on { background: var(--lime); border-color: var(--lime); }
.mute { background: var(--panel); border: 2px solid var(--sky); padding: 6px 8px; font-family: var(--font-display); font-size: 10px; }
.screen { flex: 1; min-height: 0; position: relative; overflow: auto; background: var(--screen); border: 4px solid var(--orange); box-shadow: 0 0 0 4px var(--ink), 0 0 0 8px var(--panel); padding: clamp(14px, 2.4vw, 34px); }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 4px); }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-family: var(--font-display); font-size: clamp(8px, .85vw, 11px); color: var(--muted); letter-spacing: .04em; }
.foot b { color: var(--gold); font-weight: 400; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .03em; line-height: 1.35; }
h1 { font-size: clamp(22px, 4.2vw, 54px); color: var(--orange); }
h2 { font-size: clamp(15px, 2vw, 26px); }
h3 { font-size: clamp(11px, 1.15vw, 15px); color: var(--sky); }
p { margin: 0; max-width: 62ch; }
.tag { font-family: var(--font-display); font-size: clamp(9px, .9vw, 12px); letter-spacing: .08em; color: var(--gold); }
.btn { background: var(--orange); color: var(--ink); border: 0; padding: 14px 18px; font-family: var(--font-display); font-size: clamp(10px, 1vw, 13px); letter-spacing: .05em; box-shadow: 4px 4px 0 #000; }
.btn:hover { background: var(--gold); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000; }
.btn.alt { background: var(--panel); color: var(--white); outline: 2px solid var(--sky); outline-offset: -2px; }
.btn.alt:hover { background: var(--panel-2); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.bob { animation: bob 1.2s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.shake { animation: shake .32s steps(4); }
@keyframes shake { 25% { transform: translate(-6px, 2px); } 50% { transform: translate(6px, -2px); } 75% { transform: translate(-4px, 0); } }

/* Title */
.title { min-height: 100%; display: grid; place-items: center; text-align: center; }
.title .inner { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.title .sub { font-size: clamp(22px, 2.4vw, 34px); color: var(--sky); max-width: 30ch; }
.title .hi { font-family: var(--font-display); font-size: clamp(9px, .9vw, 12px); color: var(--lime); }
.title .credit { font-size: 20px; color: var(--muted); }

/* Map */
.map { display: flex; flex-direction: column; gap: 22px; }
.world { border: 3px solid var(--panel-2); background: rgba(0, 44, 108, .45); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.world.boss { border-color: var(--danger); }
.world-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.world-head p { color: var(--muted); font-size: 22px; }
.nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; position: relative; }
.node { position: relative; text-align: left; background: var(--panel); border: 3px solid var(--sky); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 128px; }
.node:hover { background: var(--panel-2); border-color: var(--gold); }
.node .code { font-family: var(--font-display); font-size: 11px; color: var(--gold); }
.node .nm { font-size: 24px; line-height: 1.05; }
.node .cc { font-size: 19px; color: var(--muted); line-height: 1.05; }
.node.done { border-color: var(--lime); }
.node.done::after { content: "★"; position: absolute; top: 6px; right: 10px; color: var(--lime); font-size: 26px; }
.node.boss { border-color: var(--danger); }
.node .here { position: absolute; right: 10px; bottom: 10px; width: 30px; }
.world.boss .nodes { grid-template-columns: minmax(0, 1fr); }

/* Level */
.lv-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 3px dashed var(--panel-2); }
.lv-head .code { font-family: var(--font-display); font-size: 12px; background: var(--orange); color: var(--ink); padding: 6px 8px; }
.lv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: clamp(16px, 2.5vw, 36px); align-items: start; }
@media (max-width: 860px) { .lv { grid-template-columns: minmax(0, 1fr); } }
.scene { background: #000c22; border: 3px solid var(--panel-2); padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 260px; position: relative; overflow: hidden; }
.scene .cap { font-family: var(--font-display); font-size: 10px; color: var(--muted); letter-spacing: .06em; text-align: center; }
.story { font-size: clamp(22px, 1.9vw, 28px); line-height: 1.2; }
.q { font-size: clamp(24px, 2.1vw, 32px); color: var(--gold); }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; background: var(--panel); border: 3px solid var(--sky); padding: 10px 12px; font-size: clamp(21px, 1.7vw, 26px); line-height: 1.1; }
.opt:hover:not(:disabled) { border-color: var(--gold); background: var(--panel-2); }
.opt .k { font-family: var(--font-display); font-size: 11px; background: var(--sky); color: var(--ink); padding: 6px 7px; }
.opt.ok { border-color: var(--lime); background: #0d4a2a; }
.opt.ok .k { background: var(--lime); }
.opt.no, .opt:disabled { border-color: var(--danger); opacity: .55; cursor: not-allowed; }
.opt code, .story code, .msg code, .fact code { font-family: var(--font-body); color: var(--lime); background: rgba(122,193,67,.12); padding: 0 4px; }
.msg { border: 3px solid var(--danger); background: rgba(255, 90, 95, .12); padding: 10px 12px; font-size: 22px; }
.msg.good { border-color: var(--lime); background: rgba(122, 193, 67, .12); }
.msg:empty { display: none; }
.err { color: var(--danger); font-size: 20px; min-height: 1em; }

/* Builder 1-1 */
.slots { display: grid; gap: 12px; }
.slot { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: start; }
@media (max-width: 560px) { .slot { grid-template-columns: minmax(0, 1fr); } }
.slot .dim { font-family: var(--font-display); font-size: 11px; color: var(--ink); background: var(--sky); padding: 8px 6px; text-align: center; }
.slot.bad .dim { background: var(--danger); }
.slot.good .dim { background: var(--lime); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel); border: 2px solid var(--muted); padding: 6px 10px; font-size: 21px; line-height: 1.05; text-align: left; }
.chip:hover { border-color: var(--gold); }
.chip.sel { border-color: var(--gold); background: var(--gold); color: var(--ink); }
.slot .why { grid-column: 2; font-size: 19px; color: var(--danger); }
@media (max-width: 560px) { .slot .why { grid-column: 1; } }

/* Pallet x-ray */
.pallet { display: flex; flex-direction: column; align-items: center; }
.cartons { display: grid; grid-template-columns: repeat(4, 56px); gap: 4px; }
.carton { position: relative; width: 56px; height: 40px; }
.carton > img { width: 56px; transition: opacity .4s steps(3); }
.carton .jars { position: absolute; inset: 4px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; opacity: 0; transition: opacity .4s steps(3); }
.carton .jars img { width: 12px; margin: auto; }
.xray .carton > img { opacity: .12; }
.xray .carton .jars { opacity: 1; }
.xray .carton { outline: 2px solid var(--sky); }
.palletbase { width: 236px; margin-top: 2px; }
.beam { position: absolute; left: 0; right: 0; height: 6px; background: var(--sky); top: 0; opacity: 0; }
.xray-run .beam { animation: beam 1s steps(10) 1; }
@keyframes beam { 0% { top: 0; opacity: .9; } 100% { top: 100%; opacity: .9; } }

/* Bubble */
.bubble { background: var(--white); color: var(--ink); padding: 10px 12px; font-size: 22px; position: relative; max-width: 260px; text-align: center; border: 3px solid var(--ink); box-shadow: 4px 4px 0 #000; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; border: 6px solid transparent; border-top-color: var(--white); }
.bubble.bad { background: var(--danger); color: var(--white); }
.bubble.good { background: var(--lime); }

/* Road */
.road { position: relative; width: 100%; height: 110px; border-bottom: 6px dashed var(--muted); }
.road .truck { position: absolute; bottom: 4px; left: 0; width: 110px; }
.road.go .truck { animation: drive 4s steps(16) forwards; }
@keyframes drive { to { left: calc(100% - 110px); } }
.temp { font-family: var(--font-display); font-size: clamp(18px, 2.4vw, 30px); font-variant-numeric: tabular-nums; color: var(--lime); display: flex; align-items: center; gap: 12px; }
.temp.hot { color: var(--danger); }
.temp img { width: 22px; }

/* Shelf */
.shelf { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; width: 100%; }
.shirt { background: transparent; border: 2px solid transparent; padding: 4px; }
.shirt img { width: 100%; max-width: 40px; margin: auto; }
.shirt.lit { border-color: var(--lime); background: rgba(122,193,67,.18); }
.shelf-plank { height: 6px; background: #8a6a43; grid-column: 1 / -1; }
.counter { font-family: var(--font-display); font-size: clamp(11px, 1.2vw, 15px); color: var(--gold); font-variant-numeric: tabular-nums; }
.reader { position: relative; }
.wave { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; border: 4px solid var(--sky); transform: translate(-50%, -50%); opacity: 0; }
.waving .wave { animation: wave 1s steps(6) 2; }
@keyframes wave { 0% { width: 20px; height: 20px; opacity: 1; } 100% { width: 480px; height: 480px; opacity: 0; } }

/* Timeline */
.tl { display: grid; gap: 6px; width: 100%; }
.tl div { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; font-size: 20px; border-left: 4px solid var(--lime); padding-left: 8px; }
.tl div span:first-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.tl .none { border-left-color: var(--danger); color: var(--danger); grid-template-columns: minmax(0, 1fr); }
.jackets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: 100%; }
.jk { border: 3px solid var(--panel-2); padding: 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.jk img { width: 64px; }
.jk .sn { font-family: var(--font-display); font-size: 10px; color: var(--gold); text-align: center; }

/* Boss */
.feed { display: grid; gap: 8px; width: 100%; }
.feed div { font-size: 22px; padding: 6px 10px; background: rgba(255,255,255,.06); border-left: 4px solid var(--danger); }
.clock { font-family: var(--font-display); font-size: clamp(20px, 3vw, 38px); color: var(--danger); font-variant-numeric: tabular-nums; text-align: center; }
.clock.fast { color: var(--lime); }
.results { display: grid; gap: 6px; width: 100%; }
.res { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; background: rgba(0,182,222,.08); border: 2px solid var(--panel-2); font-size: 21px; }
.res img { width: 30px; }
.res .n { font-family: var(--font-display); font-size: 11px; color: var(--gold); font-variant-numeric: tabular-nums; }
.res.blocked { border-color: var(--orange); background: rgba(242,99,52,.18); }
.res.blocked .n { color: var(--orange); }
.req { font-size: 19px; color: var(--sky); word-break: break-all; background: #000c22; border: 2px solid var(--panel-2); padding: 8px; }

/* Win */
.win { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(16px, 2.5vw, 34px); align-items: start; }
@media (max-width: 860px) { .win { grid-template-columns: minmax(0, 1fr); } }
.win h2 { color: var(--lime); }
pre.json { margin: 0; background: #000c22; border: 3px solid var(--lime); padding: 12px 14px; font-family: var(--font-body); font-size: clamp(18px, 1.45vw, 22px); line-height: 1.1; overflow-x: auto; max-height: 52vh; overflow-y: auto; color: var(--muted); }
pre.json .k { color: var(--sky); }
pre.json .s { color: var(--lime); }
pre.json .n { color: var(--gold); }
.power { border: 3px solid var(--gold); background: rgba(251,176,52,.1); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.power .pn { font-family: var(--font-display); font-size: clamp(12px, 1.3vw, 17px); color: var(--gold); }
.fact { font-size: 22px; border-left: 4px solid var(--sky); padding-left: 12px; }

/* Final */
.final { display: flex; flex-direction: column; gap: 22px; align-items: center; text-align: center; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; width: 100%; }
.pcell { border: 3px solid var(--panel-2); padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 4px; opacity: .4; }
.pcell.on { border-color: var(--gold); opacity: 1; }
.pcell .pn { font-family: var(--font-display); font-size: 10px; color: var(--gold); }
.pcell span:last-child { font-size: 19px; color: var(--muted); }
.versus { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; width: 100%; }
.vs { border: 3px solid var(--panel-2); padding: 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.vs .from { color: var(--danger); font-family: var(--font-display); font-size: 12px; }
.vs .to { color: var(--lime); font-family: var(--font-display); font-size: clamp(16px, 1.8vw, 22px); }
.vs small { font-size: 19px; color: var(--muted); }

/* Overlay */
.overlay { position: absolute; inset: 0; background: rgba(0, 16, 43, .92); display: grid; place-items: center; z-index: 5; text-align: center; padding: 20px; }
.overlay .box { display: flex; flex-direction: column; gap: 18px; align-items: center; }
.overlay .count { font-family: var(--font-display); font-size: 64px; color: var(--gold); }
@media (prefers-reduced-motion: reduce) {
  .blink, .bob, .shake, .road.go .truck, .waving .wave, .xray-run .beam { animation: none !important; }
  .road.go .truck { left: calc(100% - 110px); }
}
</style>
</head>
<body>

<div class="app">
  <div class="hud" id="hud"></div>
  <main class="screen" id="screen" aria-live="polite"></main>
  <div class="foot">
    <span><b>1-4</b> SCEGLI · <b>INVIO</b> CONFERMA · <b>ESC</b> MAPPA · <b>M</b> AUDIO</span>
    <span>GS1 ITALY · REVERSE COACHING EPCIS</span>
  </div>
</div>

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const screen = $("#screen");
  const hud = $("#hud");

  /* ---------- Pixel sprites ---------- */
  const PAL = { o: "#f26334", O: "#b8461f", w: "#f4f7fb", k: "#00102b", b: "#002c6c", s: "#00b6de", l: "#7ac143", p: "#f05587", c: "#c69c6d", C: "#8a6a43", y: "#fbb034", g: "#7a8aa6", G: "#4a5878", r: "#ff5a5f" };
  const SPR = {
    jar: ["...oooooo...", ".oooooooooo.", ".OOOOOOOOOO.", "..wwwwwwww..", "..wkwwwwkw..", "..wkwwwwkw..", "..wwwoowww..", "..wwwwwwww..", "..bbbbbbbb..", "..bwbwbbwb..", "..bwbwbbwb..", "..bbbbbbbb..", "..wwwwwwww..", "...wwwwww..."],
    minijar: [".oooo.", "oooooo", ".wwww.", ".wkkw.", ".bbbb.", ".wwww."],
    carton: ["CCCCCCCCCCCCCC", "CcccccyycccccC", "CcccccyycccccC", "CccccccccccccC", "CcwwwwwccccccC", "CckwkwkccccccC", "CckwkwkccccccC", "CcwwwwwccccccC", "CccccccccccccC", "CCCCCCCCCCCCCC"],
    pallet: ["cccccccccccccccccccccccccccccc", "CCCCCCCCCCCCCCCCCCCCCCCCCCCCCC", "cc..........cccccc..........cc", "CC..........CCCCCC..........CC"],
    truck: ["bbbbbbbbbbbb......", "bwwwwwwwwwwb......", "bwsssssssswbooo...", "bwwwwwwwwwwboskoo.", "bwwwwwwwwwwbossooo", "bwwwwwwwwwwboooooo", "bbbbbbbbbbbboooooo", "..kgk.....kgk.kgk.", "...k.......k...k.."],
    shirt: ["...ss..ss...", ".ssssssssss.", "ssssssssssss", "ssssssssssss", "..ssssssss..", "..ssssssss..", "..sssyysss..", "..ssssssss..", "..ssssssss..", "..ssssssss.."],
    jacket: ["...oo..oo...", ".oooowwoooo.", "ooooowwooooo", "ooooowwooooo", "oo.oowwoo.oo", "oo.ookkoo.oo", "oo.ookkoo.oo", "...ookkoo...", "...ookkoo...", "...oooooo..."],
    heart: [".pp.pp.", "ppppppp", "ppppppp", ".ppppp.", "..ppp..", "...p..."],
    thermo: [".www.", ".w.w.", ".w.w.", ".wrw.", ".wrw.", ".wrw.", ".wrw.", "wrrrw", "wrrrw", ".www."],
    store: ["oooooooooooooo", "owowowowowowow", "oooooooooooooo", "wwwwwwwwwwwwww", "wssswwwwwwsssw", "wssswwbbwwsssw", "wssswwbbwwsssw", "wwwwwwbbwwwwww", "wwwwwwbbwwwwww", "GGGGGGGGGGGGGG"],
    factory: ["..gg..........", "..gg..........", "..gg...b...b..", "..gg..bb..bb..", "bbbbbbbbbbbbbb", "bwwbbwwbbwwbbb", "bwwbbwwbbwwbbb", "bbbbbbbbbbbbbb", "bbbbbooobbbbbb", "bbbbbooobbbbbb"],
    cedi: ["....bbbbbb....", "..bbbbbbbbbb..", "bbbbbbbbbbbbbb", "bwwwwwwwwwwwwb", "bwggggggggggwb", "bwgGGGGGGGGgwb", "bwggggggggggwb", "bwgGGGGGGGGgwb", "bwggggggggggwb", "GGGGGGGGGGGGGG"],
    reader: ["..ss..", ".s..s.", "s.bb.s", "..bb..", ".bbbb.", ".bkkb.", ".bkkb.", ".bbbb.", "..bb..", "..bb.."],
    person: ["..yyyy..", ".yyyyyy.", ".wkwwkw.", ".wwwwww.", "..wwww..", ".bbbbbb.", "bbbbbbbb", "bbbbbbbb", ".bb..bb.", ".kk..kk."],
    alarm: ["...rr...", "..rrrr..", ".rrwwrr.", ".rrwwrr.", ".rrwwrr.", ".rrrrrr.", "rrrwwrrr", "rrrrrrrr"]
  };
  const cache = {};
  function sprite(name, scale) {
    const key = name + scale;
    if (cache[key]) return cache[key];
    const rows = SPR[name];
    const w = rows[0].length, h = rows.length;
    const cv = document.createElement("canvas");
    cv.width = w * scale; cv.height = h * scale;
    const ctx = cv.getContext("2d");
    rows.forEach((r, y) => { [...r].forEach((ch, x) => { if (PAL[ch]) { ctx.fillStyle = PAL[ch]; ctx.fillRect(x * scale, y * scale, scale, scale); } }); });
    return (cache[key] = cv.toDataURL());
  }
  const img = (name, w, cls = "", alt = "") => `<img class="px ${cls}" src="${sprite(name, 4)}" style="width:${w}px" alt="${alt}">`;

  /* ---------- Sound ---------- */
  let actx = null;
  function beep(f, d, type = "square", delay = 0, vol = 0.06) {
    if (state.muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + delay;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);

          t += 2; const v = (t / 10).toFixed(1).replace(".", ",");
          $("#tv").textContent = v + " °C"; sfx.tick();
          if (t > 80) $("#temp").classList.add("hot");
          if (t >= end) {
            clearInterval(iv); sfx.alarm();
            $("#qa").innerHTML = `<p class="q">Il sensore ha registrato fino a 9 °C. Dove va questa informazione?</p><div class="opts" id="opts"></div><div class="row" id="after"></div>`;
            ask($("#opts"), [
              { t: "In un'email al responsabile qualità", why: "L'email arriva a una persona sola e non è legata al pallet: in caso di problema nessuno la ritrova." },
              { t: "Nel COME dell'evento: <code>sensorElementList</code>", ok: true, why: "Il dato del sensore entra nell'evento ed è collegato a quel pallet, in quel momento, in quel luogo." },
              { t: "In un campo note libero", why: "Un testo libero non si può interrogare né confrontare tra partner." }
            ], () => {
              $("#after").innerHTML = `<button class="btn" data-primary id="reg">REGISTRA EVENTO</button>`;
              $("#reg").onclick = () => win("1-4", {
                type: "ObjectEvent", eventTime: "2026-11-02T13:20:00.000+01:00", eventTimeZoneOffset: "+01:00",
                action: "OBSERVE", bizStep: "transporting", disposition: "in_transit",
                epcList: [SSCC],
                sensorElementList: [{ sensorMetadata: { time: "2026-11-02T13:20:00.000+01:00" }, sensorReport: [{ type: "gs1:Temperature", minValue: 4.1, maxValue: 9.0, uom: "CEL" }] }]
              }, "Minimo e massimo viaggiano dentro l'evento, con unità di misura standard (<code>CEL</code>). Chi riceve il pallet sa subito se la catena del freddo ha tenuto.");
            });
          }
        }, reduce ? 20 : 160);
      };
    },

    "1-5"() {
      show(levelShell("1-5",
        `${img("cedi", 150, "", "")}<div class="req">receiving · lotto <span style="color:var(--danger)">L132</span> · 288 pz</div><span class="cap">EVENTO GIÀ LETTO DA 3 PARTNER</span>`,
        `<p class="story">Il pallet arriva al CeDi. L'operatore registra il ricevimento ma digita <code>L132</code> invece di <code>L123</code>. L'evento è già stato letto dal produttore, dal trasportatore e dalla sede.</p>
         <p class="q">Che cosa fai?</p>
         <div class="opts" id="opts"></div><div class="row" id="after"></div>`));
      ask($("#opts"), [
        { t: "Cancello l'evento e lo riscrivo giusto", why: "<b style=\"color:var(--danger)\">GAME OVER per la fiducia.</b> In EPCIS gli eventi non si cancellano: altri sistemi li hanno già letti. Cancellare vuol dire riscrivere la storia di nascosto." },
        { t: "Pubblico una dichiarazione di errore e un evento corretto", ok: true, why: "Così la storia resta onesta: si vedono sia l'errore sia la correzione, con l'ora in cui è stata fatta." },
        { t: "Faccio finta di niente, tanto è una cifra", why: "Il lotto L132 risulterebbe al CeDi. In caso di richiamo cercheresti i vasetti nel posto sbagliato." }
      ], () => {
        $("#after").innerHTML = `<button class="btn" data-primary id="reg">REGISTRA CORREZIONE</button>`;
        $("#reg").onclick = () => win("1-5", {
          type: "ObjectEvent", eventID: "urn:uuid:6f1c2a3e-9b7d-4e21-8c5a-1d2e3f4a5b6c",
          eventTime: "2026-11-02T16:30:00.000+01:00", eventTimeZoneOffset: "+01:00",
          action: "OBSERVE", bizStep: "receiving", disposition: "in_progress",
          epcList: [SSCC],
          errorDeclaration: { declarationTime: "2026-11-02T16:45:00.000+01:00", reason: "incorrect_data", correctiveEventIDs: ["urn:uuid:0b9e7d1c-3a2f-4c8b-9e6d-7f5a4b3c2d1e"] }
        }, "La correzione ripete l'evento sbagliato con un <code>errorDeclaration</code>: motivo standard (<code>incorrect_data</code>) e puntatore all'evento corretto. Niente sparisce, tutto si spiega.");
      });
    },

    "2-1"() {
      const shirts = Array.from({ length: 24 }, (_, i) => `<button class="shirt" data-i="${i}" aria-label="T-shirt ${i + 1}"><img class="px" src="${sprite("shirt", 4)}" alt=""></button>`).join("");
      show(levelShell("2-1",
        `<div class="reader" id="reader">${img("reader", 36, "", "")}<div class="wave"></div></div><div class="shelf" id="shelf">${shirts.slice(0)}</div><div class="shelf-plank" style="width:100%"></div><span class="counter" id="cnt">LETTI 00/24 · 00:00</span>`,
        `<p class="story">Ogni t-shirt ha un cartellino con barcode e tag RAIN RFID. Dentro c'è la stessa identità: l'EPC del capo.</p>
         <p class="q">Round 1 · barcode. Clicca le t-shirt una alla volta, come con la pistola ottica.</p>
         <div class="row" id="ctl"><button class="btn" data-primary id="rfid">BASTA, PASSA ALL'RFID</button></div>
         <div class="stack" id="qa"></div>`));
      let read = 0, start = null, timer = null, mode = "bar";
      const cnt = $("#cnt");
      const fmt = s => `LETTI ${String(read).padStart(2, "0")}/24 · 00:${String(s).padStart(2, "0")}`;
      screen.querySelectorAll(".shirt").forEach(b => b.onclick = () => {
        if (mode !== "bar" || b.classList.contains("lit")) return;
        if (!start) { start = Date.now(); timer = setInterval(() => cnt.textContent = fmt(Math.floor((Date.now() - start) / 1000)), 250); }
        b.classList.add("lit"); read++; sfx.sel(); cnt.textContent = fmt(Math.floor((Date.now() - start) / 1000));
      });
      $("#rfid").onclick = () => {
        clearInterval(timer);
        const barSec = start ? Math.max(1, Math.round((Date.now() - start) / 1000)) : 0;
        const barRead = read;
        mode = "rfid"; read = 0;
        screen.querySelectorAll(".shirt").forEach(b => b.classList.remove("lit"));
        cnt.textContent = fmt(0);
        $("#ctl").innerHTML = `<button class="btn" data-primary id="scan">LETTURA RAIN RFID</button>`;
        $(".q").textContent = "Round 2 · RAIN RFID. Un solo comando, a distanza, senza vedere i capi.";
        $("#scan").onclick = () => {
          $("#ctl").innerHTML = ""; $("#reader").classList.add("waving"); sfx.power();
          const all = [...screen.querySelectorAll(".shirt")];
          all.forEach((b, i) => setTimeout(() => { b.classList.add("lit"); read++; cnt.textContent = fmt(1); if (i % 4 === 0) sfx.tick(); if (i === all.length - 1) after(); }, reduce ? 0 : 40 * i));
          function after() {
            setMsg(`Barcode: ${barRead} capi in ${barSec} secondi. RAIN RFID: 24 capi in un secondo.`, true);
            $("#qa").innerHTML = `<p class="q">Domanda trabocchetto: cosa ha letto davvero il lettore?</p><div class="opts" id="opts"></div><div class="row" id="after"></div>`;
            ask($("#opts"), [
              { t: "L'RFID: è lui l'identità del capo", why: "L'RFID è il vettore, come la tessera su cui è stampato il codice fiscale. L'identità è un'altra cosa." },
              { t: "L'EPC del capo, trasportato dal tag RFID", ok: true, why: "Giusto. L'EPC è il dato, l'RFID il mezzo. Lo stesso EPC può stare in un barcode, in un tag NFC o in un database." },
              { t: "Il prezzo del capo", why: "Il prezzo non sta nel banco EPC del tag: lì c'è l'identità del capo." }
            ], () => {
              $("#after").innerHTML = `<button class="btn" data-primary id="reg">REGISTRA INVENTARIO</button>`;
              $("#reg").onclick = () => win("2-1", {
                type: "ObjectEvent", eventTime: "2026-11-02T08:55:00.000+01:00", eventTimeZoneOffset: "+01:00",
                action: "OBSERVE", bizStep: "cycle_counting", disposition: "sellable_accessible",
                epcList: ["https://id.gs1.org/01/09506000134376/21/TS-0001", "https://id.gs1.org/01/09506000134376/21/TS-0002", "https://id.gs1.org/01/09506000134376/21/TS-0003"],
                bizLocation: { id: "https://id.gs1.org/414/0614141000005" }
              }, "Qui ne vedi 3, nella lista vera ci sono tutti e 24 i seriali. Con questi eventi Decathlon ha portato l'accuratezza dell'inventario dal 70% al 95%.");
            });
          }
        };
      };
    },

    "2-2"() {
      const histA = [["03/09", "commissioning · Fabbrica di Biella"], ["10/09", "shipping · Biella → CeDi"], ["11/09", "receiving · CeDi di Piacenza"], ["19/09", "shipping · CeDi → negozio"], ["20/09", "receiving · Negozio di Milano"], ["12/10", "retail_selling · Negozio di Milano"]];
      show(levelShell("2-2",
        `<div class="jackets">
           <div class="jk">${img("jacket", 64, "", "")}<span class="sn">CAPO A<br>JK-0457</span><button class="btn alt" data-key="8" id="qa1">INTERROGA</button><div class="tl" id="tlA"></div></div>
           <div class="jk">${img("jacket", 64, "", "")}<span class="sn">CAPO B<br>JK-9999</span><button class="btn alt" data-key="9" id="qb1">INTERROGA</button><div class="tl" id="tlB"></div></div>
         </div><span class="cap">STESSO GTIN 09506000134369 · SERIALI DIVERSI</span>`,
        `<p class="story">Negozio di Roma. Due giubbotti identici tornano indietro senza scontrino. Interroga il repository EPCIS e leggi la storia di ciascun seriale.</p>
         <p class="q">Quale reso accetti?</p>
         <div class="opts" id="opts"></div><div class="row" id="after"></div>`));
      $("#qa1").onclick = () => { sfx.sel(); $("#tlA").innerHTML = histA.map(([d, e]) => `<div><span>${d}</span><span>${e}</span></div>`).join(""); };
      $("#qb1").onclick = () => { sfx.no(); $("#tlB").innerHTML = `<div class="none"><span>0 eventi trovati. Nessuna fabbrica del brand ha mai creato questo seriale.</span></div>`; };
      ask($("#opts"), [
        { t: "Capo A · JK-0457", ok: true, why: "Il capo A ha una storia completa: prodotto a Biella, venduto a Milano il 12/10. Reso accettato." },
        { t: "Capo B · JK-9999", why: "Il capo B non ha storia: quel seriale non è mai nato. Probabile contraffazione." },
        { t: "Entrambi, sembrano uguali", why: "Visti da fuori sì. Ma solo uno dei due ha un passato verificabile." }
      ], () => {
        $("#qa1").click(); $("#qb1").click();
        $("#after").innerHTML = `<button class="btn" data-primary id="reg">REGISTRA IL RESO</button>`;
        $("#reg").onclick = () => win("2-2", {
          type: "ObjectEvent", eventTime: "2026-11-02T17:10:00.000+01:00", eventTimeZoneOffset: "+01:00",
          action: "OBSERVE", bizStep: "receiving", disposition: "returned",
          epcList: ["https://id.gs1.org/01/09506000134369/21/JK-0457"],
          bizLocation: { id: "https://id.gs1.org/414/0614141000012" }
        }, "La sequenza di eventi è il pedigree del capo: chi l'ha prodotto, dove è passato, dove è stato venduto. È la base per resi, anticontraffazione e Passaporto Digitale di Prodotto.");
      });
    },

    "boss"() {
      show(levelShell("boss",
        `${img("alarm", 64, "blink", "")}<div class="clock" id="clock">0 g 00 h</div><div class="feed" id="feed"></div><span class="cap" id="bcap">ROUND 1 · COME UNA VOLTA</span>`,
        `<p class="story">Il laboratorio segnala un problema sul lotto L123. Bisogna bloccare tutti i vasetti, ovunque siano. Prima prova come si faceva senza EPCIS.</p>
         <div class="row" id="ctl"><button class="btn" data-primary id="old">PROVA COME UNA VOLTA</button></div>
         <div class="stack" id="phase2"></div>`));
      const steps = ["Telefono al CeDi: «vi richiamo domattina»", "Email al trasportatore: risposta automatica, fuori ufficio", "Apro lotti_DEF_v3_finale(2).xlsx", "Il negozio di Monza non trova il DDT", "Per sicurezza: richiamo tutta la produzione della settimana"];
      $("#old").onclick = () => {
        $("#ctl").innerHTML = "";
        let h = 0; const total = 6 * 24 + 18; let s = 0;
        const iv = setInterval(() => {
          h = Math.min(total, h + 4);
          $("#clock").textContent = `${Math.floor(h / 24)} g ${String(h % 24).padStart(2, "0")} h`;
          if (h >= (s + 1) * (total / steps.length) && s < steps.length) { $("#feed").insertAdjacentHTML("beforeend", `<div>${steps[s++]}</div>`); sfx.no(); }
          if (h >= total) {
            clearInterval(iv); state.lives = Math.max(1, state.lives - 1); renderHud(); shake();
            setMsg("Troppo tardi: 6 giorni e 18 ore per rispondere (il tempo misurato da Walmart prima della tracciabilità a eventi). Riprova con i tuoi poteri.");
            $("#ctl").innerHTML = `<button class="btn" data-primary id="new">USA I SUPERPOTERI</button>`;
            $("#new").onclick = phase2;
          }
        }, reduce ? 10 : 120);
      };
      function phase2() {
        setMsg("");
        $("#ctl").innerHTML = ""; $("#feed").innerHTML = ""; $("#clock").textContent = "0,0 s"; $("#clock").classList.add("fast"); $("#bcap").textContent = "ROUND 2 · CON EPCIS";
        $("#phase2").innerHTML = `<p class="q">Componi la domanda al repository EPCIS. Quale lotto cerchi?</p><div class="opts" id="opts"></div><div class="stack" id="out"></div>`;
        ask($("#opts"), [
          { t: "Tutti i lotti di quel GTIN", why: "Funzionerebbe, ma richiameresti anche i lotti sani. Il superpotere è il richiamo chirurgico." },
          { t: "Lotto L132", why: "Attenzione: L132 era l'errore di battitura corretto al CeDi. Il lotto con il problema è L123." },
          { t: "GTIN 09506000134352 · lotto L123", ok: true, why: "Proprio quello. Invio la query." }
        ], run);
      }
      function run() {
        const rows = [["cedi", "CeDi di Bologna · in magazzino", 96], ["truck", "Camion TR-22 · in viaggio verso Monza", 48], ["store", "Negozio di Milano · a scaffale", 72], ["store", "Negozio di Monza · in retro", 48], ["person", "Già venduti ai consumatori", 24]];
        $("#out").innerHTML = `<div class="req">GET /events?MATCH_anyEPCClass=${LOT}</div><div class="results" id="res"></div><div class="row" id="ctl2"></div>`;
        let t = 0;
        const iv = setInterval(() => { t = Math.min(22, t + 2); $("#clock").textContent = (t / 10).toFixed(1).replace(".", ",") + " s"; if (t >= 22) { clearInterval(iv); show2(); } }, reduce ? 5 : 60);
        function show2() {
          sfx.coin();
          $("#res").innerHTML = rows.map((r, i) => `<div class="res" id="r${i}"><img class="px" src="${sprite(r[0], 4)}" alt=""><span>${r[1]}</span><span class="n">${r[2]} PZ</span></div>`).join("");
          $("#feed").innerHTML = `<div style="border-left-color:var(--lime)">288 vasetti trovati in 5 posizioni</div>`;
          $("#ctl2").innerHTML = `<button class="btn" data-primary id="block">BLOCCA IL LOTTO · RECALLED</button>`;
          $("#block").onclick = () => {
            sfx.alarm();
            rows.forEach((r, i) => setTimeout(() => { const el = $("#r" + i); el.classList.add("blocked"); el.querySelector(".n").textContent = i === 4 ? "AVVISO" : "BLOCCATI"; }, reduce ? 0 : 200 * i));
            setTimeout(() => {
              $("#ctl2").innerHTML = `<button class="btn" data-primary id="reg">BOSS SCONFITTO ▶</button>`;
              $("#reg").onclick = () => win("boss", {
                type: "ObjectEvent", eventTime: "2026-11-02T18:00:00.000+01:00", eventTimeZoneOffset: "+01:00",
                action: "OBSERVE", bizStep: "holding", disposition: "recalled",
                quantityList: [{ epcClass: LOT, quantity: 264 }],
                bizLocation: { id: "https://id.gs1.org/414/0614141007776" }
              }, "Una domanda, una risposta in 2,2 secondi, solo i 288 vasetti del lotto L123. Funziona perché ogni pagina del diario era stata scritta bene, passo dopo passo.");
            }, reduce ? 0 : 1100);
          };
        }
      }
    }
  };

  function renderFinal() {
    state.view = "final";
    sfx.power();
    show(`<div class="final">
      <span class="tag">GAME CLEAR</span>
      <div class="bob">${img("jar", 100, "", "")}</div>
      <h1 style="color:var(--lime)">MISSIONE COMPIUTA</h1>
      <p class="sub" style="font-size:clamp(22px,2.2vw,32px);color:var(--sky)">EPCIS: se funziona, non sai che c'è.</p>
      <span class="counter">PUNTEGGIO ${String(state.score).padStart(5, "0")} EVENTI</span>
      <div class="pgrid">${ORDER.map(id => `<div class="pcell ${state.powers.includes(id) ? "on" : ""}"><span class="pn">${POWERS[id][0]}</span><span>${POWERS[id][1]}</span></div>`).join("")}</div>
      <div class="versus">
        <div class="vs"><span class="tag">WALMART · MANGHI</span><span class="from">6 GIORNI E 18 ORE</span><span class="to">2,2 SECONDI</span><small>Da quale azienda agricola viene il mango? Prima e dopo la tracciabilità a eventi.</small></div>
        <div class="vs"><span class="tag">NHS · SCAN4SAFETY</span><span class="from">8,33 GIORNI</span><span class="to">MENO DI 35 MIN</span><small>Richiamo di un dispositivo medico: chi l'ha ricevuto?</small></div>
      </div>
      <div class="row" style="justify-content:center"><button class="btn alt" id="toMap">MAPPA</button><button class="btn" data-primary id="again">GIOCA ANCORA</button></div>
    </div>`);
    $("#toMap").onclick = renderMap;
    $("#again").onclick = () => { const m = state.muted; state = Object.assign(fresh(), { muted: m }); renderHud(); renderTitle(); };
  }

  /* ---------- Keyboard ---------- */
  document.addEventListener("keydown", e => {
    if (e.key === "m" || e.key === "M") { toggleMute(); return; }
    if (e.key === "Escape") { if (state.view !== "title") renderMap(); return; }
    if (/^[1-9]$/.test(e.key)) {
      const b = screen.querySelector(`[data-key="${e.key}"]:not(:disabled)`);
      if (b) { b.click(); e.preventDefault(); }
      return;
    }
    if (e.key === "Enter" || (e.key === " " && !(document.activeElement && document.activeElement.tagName === "BUTTON"))) {
      if (e.key === "Enter" && document.activeElement && document.activeElement.tagName === "BUTTON") return;
      const ov = screen.querySelector(".overlay [data-primary]");
      const b = ov || [...screen.querySelectorAll("[data-primary]")].pop();
      if (b) { b.click(); e.preventDefault(); }
    }
  });

  /* ---------- Boot ---------- */
  function start() {
    renderHud();
    if (state.view === "map" || state.view === "level" || state.view === "intro") renderMap();
    else if (state.view === "final") renderFinal();
    else renderTitle();
  }
  start();
})();
</script>
</body>
</html>

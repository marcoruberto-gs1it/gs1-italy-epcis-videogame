 comprato.`},textile:{heading:`Filiera tessile`,text:`Il cartellino che parla: dalla fibra di cotone al reso in negozio.`},finale:{heading:`Sfida finale`,text:`Un allarme sul latte del lotto L123. Si affronta dopo le due filiere, con tutti i superpoteri.`},level:`Tappa {id}`,finaleNode:`Tappa 1-8`,here:`Sei qui`,play:`Gioca la tappa {id}`,playFinale:`Gioca la tappa 1-8`,seeEnd:`Vedi il traguardo`,codex:`Glossario del gioco (G)`,tabsAria:`Scegli la filiera`,progress:`{n} di {total}`,goto:{food:`Torna alla filiera alimentare`,textile:`Passa alla filiera tessile`,finale:`Vai alla sfida finale`}},intro:{tag:`{w} · tappa {n} di {total}`,tagFinale:`Filiera alimentare · tappa 8 di nove`,concept:`Concetto: {c}`,go:`Inizia`},level:{code:`Tappa {id}`,codeFinale:`Tappa 1-8`,register:`Registra l'evento`,context:`Il contesto`,glossary:`Glossario`},win:{heading:`Evento registrato`,diary:`La pagina del diario, nel formato EPCIS`,diaryMany:`Le pagine del diario, nel formato EPCIS`,showDoc:`Documento completo (D)`,showEvents:`Solo gli eventi (D)`,docNote:`Lo stesso evento dentro il documento completo che i sistemi delle aziende si scambiano.`,unlocked:`Superpotere sbloccato`,whyTitle:`Perché conta`,who:`A chi serve`,source:`Fonte`,codexNew:`Nuove voci nel glossario del gioco: {list}`,map:`Mappa`,next:`Tappa {id}`,nextFinale:`Ritiro e richiamo`,end:`Vai al traguardo`,glossary:`Glossario`,stamp:`Registrato`},roles:{produttore:`Produttore`,distribuzione:`Distribuzione`,consumatore:`Consumatore`,autorita:`Autorità`},continue:{heading:`Vite finite. Continui?`,coin:`Continua con tre vite`},final:{tag:`Traguardo`,heading:`Missione compiuta`,sub:`EPCIS: se funziona, non sai che c'è.`,score:`Punteggio {n} eventi`,powersTitle:`I tuoi superpoteri`,benefitsTitle:`Cosa porti A casa`,benefitsSub:`I vantaggi principali emersi nel gioco, per chi produce, chi distribuisce e chi compra.`,print:`Stampa il promemoria`,map:`Mappa`,again:`Gioca ancora`,benefits:{produttore:[`Ritiri mirati: fermi solo i lotti coinvolti`,`Meno telefonate e meno errori con le altre aziende`,`La storia dei materiali è pronta da condividere con clienti e autorità`],distribuzione:[`Ricevimento veloce: leggi un'etichetta e conosci tutto il contenuto`,`Catena del freddo verificata pallet per pallet`,`Correzioni visibili a tutte le aziende, senza cancellare nulla`],consumatore:[`Prodotti più sicuri, con ritiri e richiami rapidi e mirati`,`Informazioni affidabili sull'origine`,`Avvisi rapidi se un prodotto comprato va riportato`]}},levels:JSON.parse(`{"food-stalla":{"meta":{"t":"Alla stalla nasce il lotto","c":"Evento di oggetto","place":"Stalla del caseificio · cisterna","short":"Stalla"},"intro":"Ciao, sono Bip! Ti guido nel diario del lotto L123. Ogni fatto che riguarda il prodotto diventa una pagina del diario: un evento EPCIS. EPCIS (Electronic Product Code Information Services) è lo standard GS1 per raccontare la storia dei prodotti. Si comincia dal latte.","story":"Sono le sei del mattino. La mungitura riempie la cisterna della stalla: 2.400 litri di latte crudo. Prima di partire per il caseificio, quel latte riceve il suo codice di lotto: C0471.","cap":"Stalla · lotto C0471 · 2.400 litri","q":"Il latte appena munto è nella cisterna. Quando conviene dargli il suo lotto, C0471?","qCtx":"Un lotto è un gruppo di prodotto fatto insieme, nelle stesse condizioni. Qui è il latte di una mungitura, raccolto nella stessa cisterna. La stalla registra la nascita del lotto con un evento: che cosa, quanto, dove e quando.","opts":[{"t":"Al caseificio, quando il latte arriva: è lì che si decide come usarlo","why":"Al caseificio arriva latte da tante cisterne. Il lotto va dato dove il latte nasce, così resta legato alla stalla e alla mungitura."},{"t":"Subito, alla stalla: il latte della stessa mungitura prende il lotto C0471 prima di partire","ok":true,"why":"Esatto. Il lotto nasce dove nasce il latte. Da qui in poi ogni azienda della filiera usa lo stesso codice."},{"t":"Nella vasca dello yogurt, insieme ai fermenti: prima non serve un codice","why":"Nella vasca il latte diventa yogurt. Per collegare latte e yogurt, il latte deve avere già il suo lotto."},{"t":"Solo se il laboratorio trova un problema: il lotto serve soltanto per ritirare il latte","why":"Il lotto si dà sempre, prima che serva. Se un problema arriva, il legame deve essere già scritto."}],"q2Ctx":"L'autocisterna arriva al caseificio con il lotto C0471. Il caseificio registra un evento di ricevimento. Nell'evento indica anche il luogo di partenza, la stalla, con il suo codice di luogo GS1.","q2":"Il caseificio riceve il latte. Che cosa scrive nell'evento di ricevimento?","opts2":[{"t":"Un lotto nuovo, scelto dal caseificio, al posto di C0471","why":"Cambiare codice spezza il filo con la stalla. Il latte è lo stesso: il lotto resta C0471."},{"t":"Solo la targa dell'autocisterna e l'ora di arrivo","why":"La targa dice quale mezzo è arrivato, non quale latte. L'evento parla del lotto C0471."},{"t":"Il lotto C0471, la quantità ricevuta e la stalla come luogo di partenza","ok":true,"why":"Esatto. Stesso lotto, quantità e luogo di partenza: chi legge l'evento risale dal caseificio alla stalla in un passo."},{"t":"Niente: basta il documento di trasporto di carta che viaggia con il latte","why":"La carta resta nel camion e non si cerca. L'evento, invece, si ritrova subito quando serve."}],"events":["Nascita del lotto di latte crudo C0471 alla stalla: 2.400 litri","Ricevimento del lotto C0471 al caseificio, con la stalla come luogo di partenza"],"fact":"L'evento di oggetto racconta un fatto su un prodotto o su un lotto. Qui il lotto C0471 nasce alla stalla e poi arriva al caseificio. Allo stesso modo anche i fermenti arrivano con il loro lotto, F2290. Con il lotto nascono anche la data di produzione e il Paese d'origine. Sono scritti con le parole comuni del GS1 Web Vocabulary.","power":["Radici","Ogni lotto riceve il suo codice dove nasce, e lo tiene per tutta la filiera."],"why":{"benefit":"Se il latte ha un problema, sai subito da quale stalla e da quale mungitura viene.","who":["produttore","autorita"]},"hint":"Chiediti dove nasce il latte, e chi lo conosce meglio.","sceneDesc":"Scena: la stalla con le mucche, la cisterna del latte e l'autocisterna che parte per il caseificio.","glossary":[["Lotto","Gruppo di prodotto fatto insieme, nelle stesse condizioni. Ha un codice, qui C0471."],["Evento","Una pagina del diario: dice che cosa è successo, quando, dove e perché."],["EPCIS","Lo standard GS1 per registrare gli eventi di un prodotto e condividerli con le altre aziende della filiera."],["Latte crudo","Il latte appena munto, non ancora trattato."],["Ricevimento","Il momento in cui la merce arriva: chi la riceve lo registra."]]},"food-latte":{"meta":{"t":"Dal latte allo yogurt","c":"Evento di trasformazione","place":"Caseificio · vasca 1","short":"Vasca"},"intro":"Il latte C0471 è arrivato dalla stalla. Ora, nella vasca 1, diventa yogurt: nasce il lotto L123.","story":"Nella vasca 1 nasce il lotto L123. Metti nella vasca solo quello che entra nello yogurt.","tankEmpty":"La vasca è vuota","tankLabel":"Nella vasca","put":"Metti nella vasca","ingredients":[{"id":"latte","t":"Latte crudo · lotto C0471","ok":true},{"id":"pallet","t":"Pallet su cui sono arrivati i fermenti · codice SSCC 180000000090000019","why":"L'SSCC è il codice del pallet, cioè dell'imballo per il trasporto. Nello yogurt entrano i fermenti, non il pallet."},{"id":"fermenti","t":"Fermenti lattici · lotto F2290","ok":true},{"id":"detergente","t":"Detergente alimentare per la vasca · lotto D3310","why":"Ha un lotto come un ingrediente, ma serve a pulire l'impianto. Non entra nello yogurt."}],"tankFull":"Latte e fermenti sono nella vasca. Il lotto L123 sta nascendo!","born":"Lotto L123 · 288 vasetti","q":"Domani il laboratorio segnala un problema sul latte C0471. Che cosa, in questo evento, ti porta ai lotti di yogurt?","opts":[{"t":"Le note aggiuntive sul lotto L123, dove si può scrivere a mano il latte usato","why":"Le note descrivono il lotto, per esempio la scadenza, ma non lo collegano al latte. Il legame lo danno i materiali in entrata e in uscita."},{"t":"Il luogo dell'evento: cercando che cosa è passato nella vasca 1 trovi i lotti giusti","why":"Per luogo trovi anche lotti fatti con altro latte. Il legame preciso lo danno entrata e uscita dello stesso evento."},{"t":"Il latte C0471 tra i materiali in entrata e il lotto L123 in uscita, nello stesso evento","ok":true,"why":"Esatto. Entrata e uscita nello stesso evento collegano latte e yogurt nei due sensi, anche solo per lotti."},{"t":"Il numero di serie di ogni vasetto, senza il quale il latte non si collega allo yogurt","why":"Non serve un numero per ogni vasetto: la trasformazione funziona anche con lotti e quantità."}],"events":["Trasformazione: latte e fermenti diventano 288 vasetti del lotto L123"],"fact":"L'evento di trasformazione collega i materiali in entrata, latte e fermenti, al prodotto in uscita, lo yogurt. Da qui risali sempre al latte di partenza, e dal latte a tutti i suoi lotti.","power":["Albero genealogico","Da ogni lotto risali ai suoi ingredienti, e da ogni ingrediente ai lotti in cui è finito."],"why":{"benefit":"Se un ingrediente ha un problema, sai subito quali lotti di prodotto finito lo contengono. Lo vedrai nell'ultima tappa.","who":["produttore","autorita"]},"hint":"Chiediti che cosa viene davvero consumato per fare lo yogurt.","sceneDesc":"Scena: la vasca del caseificio. Intorno ci sono latte, fermenti, un pallet vuoto e un detergente. Quello che metti nella vasca compare nell'elenco.","qCtx":"Il caseificio registra un evento di trasformazione: elenca i materiali in entrata e il prodotto in uscita. In entrata ci sono il latte C0471 e i fermenti F2290; in uscita c'è il lotto di yogurt L123. Domani questo evento sarà il legame scritto tra latte e yogurt.","glossary":[["Lotto","Gruppo di prodotti fatti insieme, nelle stesse condizioni. Ha un codice, qui L123."],["Evento","Una pagina del diario: dice che cosa è successo, quando, dove e perché."],["EPCIS","Lo standard GS1 per registrare gli eventi di un prodotto e condividerli con le altre aziende della filiera."],["Evento di trasformazione","Evento in cui dei materiali in entrata diventano un prodotto nuovo in uscita: latte e fermenti diventano yogurt."],["SSCC","Serial Shipping Container Code: il codice GS1 di un'unità di trasporto, come un pallet. Sta sull'etichetta logistica."]]},"food-nascita":{"meta":{"t":"Nasce il vasetto","c":"Le quattro domande di un evento","place":"Caseificio · linea 2","short":"Controllo qualità"},"intro":"Il lotto L123 è nato nella vasca. Adesso passa il controllo qualità sulla linea 2. Scriviamo la sua carta d'identità.","story":"Ogni evento EPCIS risponde a quattro domande. COSA: quale prodotto. QUANDO: data, ora e fuso orario. DOVE: il luogo, indicato con il suo codice GLN. PERCHÉ: la fase del processo. Il lotto L123 è al controllo qualità sulla linea 2: scegli una risposta per ogni riga.","cap":"Lotto L123 · 288 vasetti · scadenza 30/11","rows":[{"d":"COSA","o":["GTIN 08000000001016 + lotto L123","Solo il GTIN 08000000001016","Solo il lotto L123"],"ok":0,"why":"Al controllo osservi un lotto preciso: serve il GTIN più il lotto. Il solo GTIN non distingue i lotti; il solo lotto non dice di quale prodotto."},{"d":"QUANDO","o":["08:20, l'ora in cui l'evento arriva nell'archivio","08:15 con il fuso orario +01:00","08:15 senza fuso orario"],"ok":1,"why":"Serve l'istante del controllo, con il fuso orario. L'ora di arrivo nell'archivio la scrive il sistema da solo."},{"d":"DOVE","o":["GLN della sede legale del gruppo","GLN del CeDi a cui va il lotto","GLN del caseificio con l'estensione «linea 2»"],"ok":2,"why":"Il DOVE è il luogo del fatto: il caseificio, con l'estensione della linea. La sede legale è un'anagrafica; il CeDi è la destinazione."},{"d":"PERCHÉ","o":["Produzione del lotto","Controllo qualità del lotto","Preparazione del lotto per la spedizione"],"ok":1,"why":"Il lotto è già nato nella vasca e non è ancora in partenza. Adesso lo stai controllando: è il controllo qualità."}],"needAll":"Scegli una risposta per ogni riga.","wrongOne":"Una riga non è comprensibile per le altre aziende. Correggi e riprova.","wrongMany":"{n} righe non sono comprensibili per le altre aziende. Correggi e riprova.","events":["Controllo qualità del lotto L123 sulla linea 2"],"fact":"Ogni risposta usa un codice GS1 o una parola comune. Prodotto e lotto con il GTIN, ora con il fuso orario, luogo con il GLN, poi la fase del processo. Così ogni azienda legge l'evento allo stesso modo.","power":["Carta d'identità","Ogni lotto ha un'identità GS1 che tutte le aziende leggono allo stesso modo."],"why":{"benefit":"Ogni azienda legge lo stesso evento allo stesso modo: niente telefonate per capire cosa, dove e quando.","who":["produttore","distribuzione"]},"hint":"Per ogni riga chiediti: un'altra azienda lo capirebbe? E descrive il fatto, o qualcos'altro?","sceneDesc":"Scena: il caseificio e la linea 2, con il vasetto del lotto L123 sul nastro verso il controllo qualità.","glossary":[["GTIN","Global Trade Item Number: il codice GS1 che identifica un prodotto. È il numero sotto il codice a barre."],["GLN","Global Location Number: il codice GS1 di un luogo, come un caseificio o un magazzino. L'estensione indica un punto preciso, come una linea."],["Fuso orario","Dice a quale ora locale si riferisce l'orario: +01:00 è l'ora italiana in inverno."],["Le quattro domande","COSA, QUANDO, DOVE e PERCHÉ: ogni evento risponde sempre a queste domande."]]},"food-raggi-x":{"meta":{"t":"Vista ai raggi X","c":"Evento di aggregazione","place":"Caseificio · fine linea","short":"Pallet"},"intro":"288 vasetti, 12 cartoni, un pallet. Al CeDi (Centro di Distribuzione) nessuno avrà voglia di aprirlo.","story":"Ogni cartone contiene 24 vasetti. Impila i 12 cartoni sul pallet.","stack":"Impila un cartone","stackAll":"Impila tutti","count":"Cartoni {n}/12 · vasetti {j}/288","q":"Al CeDi leggono solo il codice SSCC del pallet. Come fanno a sapere che dentro ci sono 12 cartoni e 288 vasetti del lotto L123?","opts":[{"t":"Il codice SSCC contiene già l'elenco dei cartoni e dei vasetti","why":"No: l'SSCC è solo il numero di serie del pallet, come una targa. Il contenuto viaggia negli eventi, non nel codice."},{"t":"Il caseificio registra un solo evento con il pallet e tutti i vasetti, elencati insieme","why":"Così sai che erano nello stesso posto, non che cosa contiene che cosa. Serve dire qual è il contenitore e qual è il contenuto."},{"t":"Il caseificio manda al CeDi un foglio di calcolo con il contenuto del pallet","why":"Il foglio resta fuori dall'archivio degli eventi. E se il pallet viene smontato, nessuno lo aggiorna."},{"t":"Il caseificio registra due aggregazioni: i vasetti dentro ogni cartone, i cartoni sopra il pallet","ok":true,"why":"Esatto. Ogni aggregazione dice contenitore e contenuto: dal pallet risali ai cartoni, dai cartoni ai vasetti. Se il pallet viene smontato, si registra un nuovo evento."}],"scan":"Leggi il codice del pallet","scanned":"Una sola lettura del codice SSCC del pallet: 12 cartoni e 288 vasetti.","cap":"Pallet · SSCC 180000000012345679","events":["Primo cartone: 24 vasetti del lotto L123 (lo stesso evento si ripete per tutti i 12 cartoni)","Pallet: i 12 cartoni, ognuno con il suo SSCC"],"fact":"Due livelli di aggregazione: 24 vasetti in ogni cartone, 12 cartoni sul pallet. Ogni evento dice qual è il contenitore, qual è il contenuto e quando nasce il legame.","power":["Vista ai raggi X","Con l'aggregazione leggi il pallet e sai cosa c'è dentro, senza aprirlo."],"why":{"benefit":"Ricevimento più veloce: leggi un'etichetta e conosci tutto il contenuto, senza aprire il pallet.","who":["distribuzione","produttore"]},"hint":"Che cosa sa davvero un codice SSCC? E chi dice che cosa c'è dentro il pallet, e dentro ogni cartone?","sceneDesc":"Scena: un pallet su cui impilare 12 cartoni da 24 vasetti. Con il lettore il pallet diventa trasparente e si vedono i 288 vasetti.","qCtx":"Il pallet ha un'etichetta con un codice SSCC. È solo un numero di serie, come la targa di un'auto: non dice che cosa c'è dentro. Al CeDi però vogliono saperlo senza aprire il pallet.","glossary":[["Pallet","La pedana su cui si impilano i cartoni per il trasporto."],["SSCC","Serial Shipping Container Code: il codice GS1 di un pallet o di un cartone. È un numero di serie, non contiene l'elenco della merce."],["Aggregazione","Il legame tra un contenitore e il suo contenuto, come i cartoni su un pallet. Si registra con un evento di aggregazione e si può disfare."],["CeDi","Centro di Distribuzione: il magazzino da cui la merce parte verso i negozi."]]},"food-cbv":{"meta":{"t":"Le parole non si inventano","c":"Vocabolario comune (CBV)","place":"Caseificio · baia 3","short":"Spedizione"},"intro":"Il pallet parte per il CeDi di Bologna. Il sistema del CeDi deve capire cosa sta succedendo, senza telefonate.","bubble":"Ciao, sono il CeDi di Bologna. Cosa mi state mandando?","bubbleBad":"??? Non conosco questa parola.","bubbleGood":"Ricevuto! Pallet in viaggio, collegato all'ordine e all'avviso di spedizione. Vi aspetto.","cap":"IL SISTEMA DEL CeDi ASCOLTA","story":"Il pallet sale sul camion. Ogni azienda chiama i fatti a modo suo: «uscita_merce», «spedito», «DDT emesso». Il CeDi riceve ogni giorno eventi da decine di fornitori diversi.","q":"Il caseificio scrive «shipping» invece di «uscita_merce». Che cosa ci guadagna il CeDi che riceve l'evento?","opts":[{"t":"Capisce subito che è una spedizione, senza chiedere al caseificio che cosa vuol dire «uscita_merce»","ok":true,"why":"Esatto. Con parole comuni ogni azienda capisce l'evento allo stesso modo, senza tabelle di conversione per ogni fornitore."},{"t":"Niente: il suo sistema avrebbe capito da solo anche «uscita_merce», come qualunque altra parola","why":"Nessun sistema sa che cosa vuol dire «uscita_merce». Senza parole comuni serve una tabella di conversione per ogni fornitore."},{"t":"L'evento diventa valido: con le parole del gestionale il sistema del CeDi lo rifiuterebbe","why":"EPCIS accetta anche parole proprie. Il problema è che le capisce solo chi le ha inventate."},{"t":"Il CeDi riceve con l'evento anche le caratteristiche del prodotto, come peso e ingredienti","why":"Il vocabolario comune descrive i fatti, non il prodotto. Le caratteristiche del prodotto viaggiano con altri servizi GS1, come il catalogo dei dati di prodotto."}],"events":["Spedizione del pallet al CeDi di Bologna, collegata all'ordine e all'avviso di spedizione"],"fact":"Il vocabolario comune dà le parole per le fasi, come «shipping» (spedizione), e per gli stati, come «in_transit» (in viaggio). Con l'evento viaggiano anche i riferimenti all'ordine e all'avviso di spedizione: il CeDi sa chi spedisce, chi riceve e che cosa.","power":["Parla con tutti","Il vocabolario comune: le stesse parole per ogni sistema della filiera."],"why":{"benefit":"Meno errori e meno telefonate: i sistemi delle aziende si capiscono senza traduzioni.","who":["produttore","distribuzione"]},"hint":"Pensa a chi riceve eventi da tanti fornitori, ognuno con le sue parole.","sceneDesc":"Scena: la baia di carico del caseificio con il camion e il CeDi di Bologna sullo sfondo.","qCtx":"GS1 ha definito un elenco di parole comuni per descrivere i fatti della filiera: il CBV (Core Business Vocabulary). Le parole sono in inglese e uguali in tutto il mondo: «shipping» vuol dire spedizione, «in_transit» merce in viaggio. Il gestionale del caseificio, invece, scrive «uscita_merce».","glossary":[["CBV","Core Business Vocabulary: il vocabolario comune GS1, cioè le parole standard per le fasi e gli stati della filiera."],["Gestionale","Il programma che un'azienda usa per ordini, magazzino e spedizioni."],["Tabella di conversione","L'elenco che traduce le parole di un'azienda in quelle di un'altra. Con il vocabolario comune non serve."],["Avviso di spedizione","Il documento elettronico che il fornitore manda al cliente prima della partenza. Elenca i pallet in arrivo e il loro contenuto. Nei gestionali si chiama DESADV."],["Ordine d'acquisto","Il documento con cui il cliente chiede la merce al fornitore: che cosa, quanto e per quando."]],"q2Ctx":"Prima che il camion parta, il caseificio manda al CeDi un avviso di spedizione. È un documento elettronico che passa da un gestionale all'altro. Elenca i pallet in arrivo e che cosa c'è sopra. L'evento di spedizione rimanda proprio a quell'avviso.","q2":"Il CeDi ha già ricevuto l'avviso di spedizione. Che cosa aggiunge l'evento di spedizione collegato all'avviso?","opts2":[{"t":"Prende il posto dell'avviso: dopo l'evento, il CeDi può eliminare l'avviso di spedizione ricevuto","why":"No: l'avviso serve al CeDi per prepararsi e controllare l'arrivo. L'evento non lo sostituisce, lo conferma."},{"t":"Riporta i prezzi e le condizioni di pagamento dell'avviso, così il CeDi può preparare la fattura","why":"Prezzi e pagamenti stanno nell'ordine e nella fattura. L'evento dice che cosa è successo, dove e quando."},{"t":"Conferma che proprio i pallet elencati nell'avviso sono partiti davvero, a che ora e da quale baia","ok":true,"why":"Esatto. L'avviso annuncia che cosa arriverà, l'evento conferma che cosa è successo. Grazie al collegamento, il CeDi li ritrova insieme."},{"t":"Conferma al caseificio che i pallet sono arrivati e controllati, al posto dell'avviso di ricevimento","why":"L'arrivo lo conferma il CeDi, quando riceve la merce, con l'avviso di ricevimento. La spedizione racconta solo la partenza."}]},"food-freddo":{"meta":{"t":"Catena del freddo","c":"Evento di associazione · sensori","place":"In viaggio verso Bologna","short":"Viaggio"},"intro":"Due ore di autostrada. Prima di partire, sul pallet viene montato un sensore di temperatura. Va collegato all'oggetto giusto.","story":"Il sensore registra la temperatura per tutto il viaggio. Lo yogurt deve restare sotto gli 8 °C.","q1":"Il pallet cambierà camion al CeDi. Perché legare il sensore al pallet con un evento di associazione?","opts1":[{"t":"Perché solo questo tipo di evento può contenere le letture dei sensori","why":"Le letture dei sensori possono stare in ogni tipo di evento. L'associazione serve a legare il dispositivo alla merce."},{"t":"Perché le misure restano riferite al pallet per tutto il viaggio, qualunque mezzo lo porti","ok":true,"why":"Esatto. L'associazione dice a quale oggetto si riferiscono le misure. È una novità di EPCIS 2.0."},{"t":"Perché le misure restano riferite al camion, che le passa al pallet quando cambia mezzo","why":"Il sensore va legato alla merce, non al mezzo. Legato al camion, al cambio di mezzo il pallet perde le sue misure."},{"t":"Perché il numero del sensore entra nell'SSCC e diventa parte dell'identità del pallet","why":"L'SSCC non cambia. Il sensore ha la sua identità e l'evento le collega."}],"drive":"Avvia il viaggio","linked":"Sensore SENS042 sul pallet 180000000012345679","cap":"Soglia yogurt · massimo 8 °C","q2":"Il sensore ha registrato 9 °C per 40 minuti. Che cosa aggiunge l'evento EPCIS rispetto al file del registratore di temperatura?","opts2":[{"t":"Il dato è legato a quel pallet, e l'evento segna da solo il pallet come danneggiato","why":"EPCIS non decide. Soglie e azioni le stabiliscono le aziende e le norme di settore."},{"t":"Il dato è legato a quel pallet, e l'evento certifica che il sensore era tarato","why":"EPCIS registra le misure e chi le ha fatte, non certifica lo strumento. La taratura resta a carico delle aziende."},{"t":"Il dato è legato al camion e al viaggio, e ogni azienda lo consulta allo stesso modo","why":"Il camion cambia al CeDi: il dato utile è quello legato al pallet, che è la merce da valutare."},{"t":"Il dato è legato a quel pallet, luogo e momento, e ogni azienda lo consulta allo stesso modo","ok":true,"why":"Esatto. Minimo, massimo e allarme diventano un fatto condiviso: la decisione è mirata su quel pallet."}],"events":["Associazione: il sensore viene legato al pallet","Trasporto: minimo, massimo e allarme della temperatura"],"fact":"Due pagine. L'evento di associazione lega il sensore al pallet. Poi l'evento di trasporto porta con sé minimo, massimo e allarme, in gradi Celsius.","power":["Catena del freddo","I dati dei sensori viaggiano dentro l'evento: minimo, massimo, allarmi."],"why":{"benefit":"Chi riceve sa subito se la catena del freddo ha tenuto e può decidere su quel pallet, non su tutto il carico.","who":["distribuzione","consumatore"]},"hint":"Pensa a che cosa succede alle misure quando il pallet cambia mezzo.","sceneDesc":"Scena: il camion in autostrada verso Bologna. La temperatura del sensore compare in alto.","q1Ctx":"Sul pallet c'è un sensore che misura la temperatura per tutto il viaggio. Al CeDi il pallet passerà su un altro camion, mentre il sensore resta attaccato al pallet. Un evento di associazione registra a quale oggetto è legato un dispositivo, come un sensore.","q2Ctx":"Le misure del sensore entrano nell'evento di trasporto del pallet: temperatura minima, massima e un allarme sopra gli 8 °C. Senza EPCIS resterebbero in un file del registratore di temperatura, scaricato da chi trasporta e inviato su richiesta.","glossary":[["Sensore","Dispositivo che misura un valore, qui la temperatura, e lo registra nel tempo."],["Evento di associazione","Evento che lega un dispositivo, come un sensore, a un oggetto, come un pallet. È una novità di EPCIS 2.0."],["Catena del freddo","Tutti i passaggi in cui un prodotto fresco deve restare sotto una certa temperatura, dalla produzione allo scaffale."]]},"food-errore":{"meta":{"t":"Ops, errore!","c":"Dichiarazione di errore","place":"CeDi di Bologna","short":"CeDi"},"intro":"Il pallet arriva al CeDi. Una persona del magazzino, stanca, registra il ricevimento...","req":"ricevimento · lotto <span class=\\"bad\\">L132</span> · 288 pezzi","cap":"Evento già letto da tre aziende","story":"Chi registra il ricevimento digita <code>L132</code> invece di <code>L123</code>. L'evento è già stato letto dal caseificio, dall'azienda di trasporto e dalla sede.","q":"Tre aziende hanno già letto l'evento con il lotto sbagliato. Come si corregge con EPCIS?","opts":[{"t":"Si ripubblica l'evento con lo stesso identificativo e il lotto giusto, al posto del vecchio","why":"<b>Fine partita per la fiducia.</b> Due versioni diverse con lo stesso codice: ogni azienda avrebbe una storia diversa."},{"t":"Si pubblica un evento di cancellazione che annulla il ricevimento, poi quello giusto","why":"In EPCIS «cancellare» indica un fatto fisico, come smontare un pallet. Non annulla un evento già pubblicato."},{"t":"Si dichiara l'errore sull'evento sbagliato, con il motivo, e lo si collega all'evento corretto","ok":true,"why":"Esatto. La storia resta verificabile: chi ha letto l'evento sbagliato vede l'errore e trova la correzione."},{"t":"Si pubblica l'evento corretto e si dichiara l'errore su questo, indicando quello sbagliato","why":"È rovesciato: l'errore si dichiara sull'evento sbagliato, che poi rimanda a quello corretto."}],"register":"Registra correzione","events":["L'evento sbagliato (lotto L132) con la dichiarazione di errore","L'evento corretto (lotto L123), con l'avviso di ricevimento"],"fact":"Nel diario restano due pagine: l'evento sbagliato, con la sua dichiarazione di errore e il motivo, e l'evento corretto, collegato al primo. Niente sparisce, tutto si spiega. Solo dopo la correzione il CeDi manda al caseificio l'avviso di ricevimento: conferma che cosa è arrivato davvero.","power":["Memoria onesta","Gli errori si correggono con una dichiarazione, mai cancellando."],"why":{"benefit":"Dati affidabili: ogni correzione è visibile a tutte le aziende, con ora e motivo.","who":["produttore","distribuzione","autorita"]},"hint":"In EPCIS la storia non si riscrive: si aggiunge qualcosa.","sceneDesc":"Scena: il pallet appena arrivato davanti al CeDi di Bologna.","qCtx":"Un evento EPCIS pubblicato è condiviso: le altre aziende lo hanno già letto e salvato nei loro sistemi. In questo ricevimento il lotto scritto è L132, ma quello vero è L123. La correzione deve essere chiara per tutti, anche per chi ha già letto l'errore.","glossary":[["Ricevimento","La registrazione della merce quando arriva in un magazzino o in un negozio."],["Dichiarazione di errore","Una nota aggiunta a un evento sbagliato: dice che era sbagliato, perché, e qual è l'evento corretto."],["Aziende della filiera","Chi legge gli stessi eventi: caseificio, trasportatore, CeDi, negozi."],["Avviso di ricevimento","Il documento elettronico con cui chi riceve la merce conferma al fornitore che cosa è arrivato davvero. Nei gestionali si chiama RECADV."]]},"tessile-filo":{"meta":{"t":"Dal filo al capo","c":"TransformationEvent a più passaggi","place":"Filiera tessile","short":"Filatura e confezione"},"intro":"Cambio di mondo: stesso standard, altro settore. Una t-shirt nasce da un tessuto, il tessuto da un filo, il filo da una fibra.","story":"Cinque passaggi reali tra fibra e t-shirt. Solo alcuni creano un prodotto nuovo: sono loro a costruire la genealogia.","q":"Scegli in ordine solo i passaggi che sono trasformazioni.","steps":[{"id":"spedizione","t":"Spedizione · il filato va dalla filatura alla tessitura","pos":-1,"why":"Cambia il luogo, non il prodotto: è una semplice spedizione."},{"id":"tessitura","t":"Tessitura · il filato diventa tessuto","pos":1},{"id":"filatura","t":"Filatura · la fibra di cotone diventa filato","pos":0},{"id":"etichetta","t":"Etichettatura · a ogni t-shirt si applica un tag RFID","pos":-1,"why":"Il capo resta lo stesso: si associa un'etichetta a un oggetto che esiste già."},{"id":"confezione","t":"Confezione · il tessuto diventa 24 t-shirt","pos":2}],"wrong":"Non ancora: ogni trasformazione usa quello che esce dalla trasformazione prima.","chainTitle":"La storia delle t-shirt","chainEmpty":"Scegli il primo passaggio.","done":"La catena è completa: fibra, filato, tessuto, t-shirt.","events":["Filatura: 120 kg di fibra diventano 110 kg di filato","Tessitura: il filato diventa 600 metri di tessuto","Confezione: 36 metri di tessuto diventano 24 t-shirt con numero di serie"],"fact":"Tre <code>TransformationEvent</code> in fila: fibra, filato, tessuto, 24 t-shirt con numero di serie. Ogni output diventa l'input del passaggio dopo. È il filo rosso su cui si costruisce il Passaporto Digitale di Prodotto (DPP).","power":["Filo rosso","Ogni capo porta con sé la storia dei suoi materiali, passaggio dopo passaggio."],"why":{"benefit":"Le informazioni su materiali e lavorazioni seguono il capo. Servono per la sostenibilità e per il Passaporto Digitale di Prodotto previsto dal regolamento europeo ESPR.","who":["produttore","consumatore","autorita"],"source":"Regolamento (UE) 2024/1781 sulla progettazione ecocompatibile dei prodotti sostenibili (ESPR)"},"hint":"Chiediti: dopo questo passaggio esiste un prodotto che prima non c'era? Se no, non è una trasformazione.","sceneDesc":"Scena: tre stazioni, filatura, tessitura e confezione. Ogni passaggio giusto si accende.","qCtx":"Una trasformazione è un passaggio in cui da uno o più materiali nasce un prodotto nuovo, con una nuova identità. Spostare un prodotto o applicargli un'etichetta non lo trasforma."},"tessile-inventario":{"meta":{"t":"Inventario lampo","c":"EPC + RAIN RFID","place":"Negozio di Milano","short":"Negozio di Milano"},"intro":"Le 24 t-shirt sono arrivate in negozio a Milano. Ore 8:55: tra cinque minuti si apre.","story":"Ogni t-shirt ha un cartellino con barcode e tag RAIN RFID (Radio Frequency Identification). Dentro c'è la stessa identità: l'EPC (Electronic Product Code) del capo.","q":"Round 1 · barcode. Scansiona le t-shirt una alla volta, come con la pistola ottica.","q2":"Round 2 · RAIN RFID. Un solo comando, a distanza, senza vedere i capi.","toRfid":"Basta, passa all'RFID","scan":"Lettura RAIN RFID","counter":"Letti {n}/24 · 00:{s}","result":"Con il barcode: {n} capi in {s} secondi. Con RAIN RFID: 24 capi in un secondo.","q3":"Il lettore RAIN RFID ha letto 24 tag in un secondo. Che cosa ha letto davvero, e perché conta?","opts":[{"t":"24 EPC, cioè GTIN e numero di serie: un'identità che vale solo finché resta nel tag","why":"L'identità non dipende dal mezzo: lo stesso EPC può stare in un barcode o in un database."},{"t":"24 EPC, cioè GTIN e numero di serie: la stessa identità può stare in un QR o in un Data Matrix","ok":true,"why":"Esatto. L'identità non dipende dal mezzo: cambi tecnologia senza cambiare dati ed eventi."},{"t":"24 codici del produttore del chip, che il lettore traduce in GTIN e numero di serie","why":"Il codice del chip identifica il chip, non il capo. Il tag porta già l'EPC GS1: nessuna traduzione."},{"t":"24 EPC con lo stesso codice: il tag riconosce il modello del capo, non il singolo capo","why":"Il tag porta GTIN più numero di serie: ogni capo è unico. Per questo nessun capo viene contato due volte."}],"register":"Registra inventario","events":["Inventario: le 24 t-shirt contate una per una"],"fact":"Nella lista ci sono tutti e 24 i numeri di serie: ogni capo è contato uno per uno, senza vederlo. Sono le stesse t-shirt nate nel livello 2-1.","power":["Lettura lampo","Stessa identità EPC, vettore RAIN RFID: uno scaffale intero in un colpo."],"why":{"benefit":"Inventari più veloci e accurati: sai cosa c'è davvero a scaffale e riordini quando serve.","who":["distribuzione","consumatore"],"case":"Decathlon applica un tag EPC/RFID al 100% dei suoi prodotti e usa oltre 50.000 lettori nel mondo. Dichiara un'efficienza dell'inventario cinque volte maggiore.","source":"GS1 US, case study «Global Retail Sporting Goods Leader Finishes First with RFID»"},"hint":"Separa il dato dal mezzo che lo trasporta. E chiediti se il dato identifica un modello o un capo.","sceneDesc":"Scena: uno scaffale con 24 t-shirt e un lettore RFID. I capi letti si accendono, il contatore in basso dice quanti sono.","q3Ctx":"Ogni tag RAIN RFID ha un piccolo chip che il lettore legge via radio, anche senza vedere i capi. Nella memoria del chip c'è l'EPC, l'identità GS1 del capo."},"tessile-reso":{"meta":{"t":"Il reso sospetto","c":"Storia del capo · pedigree","place":"Negozio di Roma","short":"Negozio di Roma"},"intro":"Due persone riportano lo stesso modello di giubbotto. Nessuna delle due ha lo scontrino.","story":"Negozio di Roma. Due giubbotti identici tornano indietro senza scontrino. Interroga il repository EPCIS, l'archivio degli eventi, e leggi la storia di ciascun numero di serie.","q":"Hai interrogato i due giubbotti. Quale conclusione puoi difendere davanti alla cliente?","jacketA":"Capo A<br>JK-0457","jacketB":"Capo B<br>JK-9999","query":"Interroga","cap":"Stesso GTIN 09506000134369 · numeri di serie diversi","historyA":[["03/09","Produzione · Fabbrica di Biella"],["10/09","Spedizione · Biella → CeDi"],["11/09","Ricevimento · CeDi di Piacenza"],["19/09","Spedizione · CeDi → negozio"],["20/09","Ricevimento · Negozio di Roma"],["12/10","Vendita · Negozio di Roma"]],"historyB":"Zero eventi trovati. Nessuna fabbrica del marchio ha mai creato questo numero di serie.","opts":[{"t":"A ha una storia completa; B è nuovo, perché un capo in magazzino non genera eventi","why":"Anche il magazzino genera eventi, e un capo vero nasce con un evento di produzione in fabbrica. Nessun evento è un campanello d'allarme."},{"t":"A ha una storia completa; B è autentico, perché il suo QR apre il sito del marchio","why":"Il QR si copia, e apre il sito anche con un numero di serie inventato. Una storia di eventi non si copia."},{"t":"A è sospetto, perché è stato venduto quasi un mese fa; B va verificato con il fornitore","why":"Il tempo passato dalla vendita non dice nulla sull'autenticità. La storia di A è completa e verificabile: è B a non avere storia."},{"t":"A ha una storia fino alla vendita; il numero di serie di B non è mai nato in fabbrica","ok":true,"why":"Esatto. Prodotto a Biella, venduto qui a Roma il 12/10: la storia verificabile vale più dello scontrino."}],"register":"Registra il reso","events":["Reso accettato del giubbotto JK-0457"],"fact":"La sequenza di eventi è il pedigree del capo: chi l'ha prodotto, dove è passato, dove è stato venduto. È la base per resi, anticontraffazione e Passaporto Digitale di Prodotto.","power":["Pedigree","La storia del capo dice se è autentico: resi, anticontraffazione, DPP."],"why":{"benefit":"Resi più sicuri e meno contraffazioni: un numero di serie senza storia è un campanello d'allarme.","who":["distribuzione","produttore","consumatore"]},"hint":"Interroga tutti e due i capi. Un capo vero può non avere nessun evento?","sceneDesc":"Scena: due giubbotti identici sul bancone e la mappa dei passaggi del capo A.","qCtx":"Il repository EPCIS conserva la storia di ogni capo con numero di serie: produzione, spedizioni, ricevimenti, vendita. Hai interrogato il repository per i due giubbotti: per A trovi sei eventi, per B nessuno."},"sfida-finale":{"meta":{"t":"Ritiro e richiamo","c":"Ricerca nell'archivio, ritiro e richiamo","place":"Tutta la filiera","short":"Ritiro e richiamo"},"intro":"Allerta! Il laboratorio segnala un problema sul latte della cisterna C0471. Dove sono finiti i vasetti fatti con quel latte?","story":"Il latte della cisterna C0471 ha un problema. Bisogna ritirare tutti i vasetti fatti con quel latte, ovunque siano, e richiamare quelli già venduti. Prima prova come si faceva senza EPCIS.","old":"Prova come una volta","round1":"Prima prova · come una volta","round2":"Seconda prova · con EPCIS","steps":["Telefono al caseificio: «vi richiamo domattina»","Email al trasportatore: risposta automatica, fuori ufficio","Apro lotti_DEF_v3_finale(2).xlsx","Il supermercato di Monza non trova il documento di trasporto","Per sicurezza: ritiro tutta la produzione della settimana"],"tooLate":"Troppo tardi: quasi sette giorni per rispondere, e alla fine ritiri tutto. Riprova con i tuoi superpoteri.","usePowers":"Usa i superpoteri","q1":"Il latte C0471 ha un problema. Che cosa cerchi per primo nell'archivio degli eventi?","opts1":[{"t":"Gli eventi del lotto L123, quello che stai seguendo: dicono dove si trova adesso","why":"Così trovi L123, ma non sai se lo stesso latte è finito anche in altri lotti."},{"t":"Le trasformazioni con C0471 tra i materiali in entrata: dicono in quali lotti di yogurt è finito","ok":true,"why":"Il superpotere ALBERO GENEALOGICO: dal latte arrivi a tutti i lotti di yogurt che lo contengono."},{"t":"Le trasformazioni con L123 in uscita: dicono quale latte è entrato nel lotto","why":"È la direzione opposta: dal lotto risali al latte. Ti serve il contrario, dal latte a tutti i suoi lotti."},{"t":"Gli eventi della cisterna C0471: dicono in quali caseifici è arrivato il latte","why":"Ti dicono dove è arrivato il latte, non in quali prodotti è finito."}],"found":"Il latte C0471 è finito in due lotti: L123 e L124.","q2":"Hai trovato i lotti L123 e L124. Che cosa fai?","opts2":[{"t":"Ritiri L123 e L124 da magazzini, camion e scaffali, e richiami i vasetti già venduti","ok":true,"why":"Proprio così: ritiro dove il prodotto è ancora nella filiera, richiamo per chi l'ha comprato. Ora cerco dove sono adesso."},{"t":"Ritiri L123 e L124 ancora nella filiera; per i vasetti già venduti non si può fare nulla","why":"L'ultimo evento dice in quale negozio sono stati venduti: con il richiamo il negozio avvisa chi li ha comprati."},{"t":"Ritiri e richiami L123 e L124, ma solo dopo l'esito del laboratorio su ogni lotto","why":"Per un rischio sulla sicurezza si agisce subito sui lotti coinvolti. Le analisi continuano, ma il prodotto si ferma."},{"t":"Ritiri tutti i lotti di yogurt fatti quel giorno nella vasca 1, per prudenza","why":"Le trasformazioni dicono già dove è finito il latte. Ritirare lotti sani è uno spreco: il superpotere è il ritiro mirato."}],"rows":[{"sp":"cedi","t":"CeDi di Bologna · in magazzino","n":"96 + 288 pz","lot":"L123 + L124"},{"sp":"truck","t":"Camion · due cartoni verso Monza","n":"48 pz","lot":"L123"},{"sp":"store","t":"Supermercato di Milano · a scaffale","n":"72 pz","lot":"L123"},{"sp":"store","t":"Supermercato di Monza · in magazzino","n":"48 pz","lot":"L123"},{"sp":"person","t":"Già venduti · a casa di chi li ha comprati","n":"24 pz","lot":"L123"}],"summary":"576 vasetti trovati in cinque posizioni: 288 del lotto L123 e 288 del lotto L124.","map":[{"id":"caseificio","t":"Caseificio","x":8,"y":52},{"id":"cedi","t":"CeDi","x":36,"y":52},{"id":"camion","t":"Camion","x":58,"y":52},{"id":"milano","t":"Milano","x":78,"y":22},{"id":"monza","t":"Monza","x":80,"y":82},{"id":"casa","t":"Case","x":94,"y":52}],"mapLit":["cedi","camion","milano","monza"],"mapNotice":["casa"],"mapAria":"Mappa della filiera: si accendono i luoghi dove si trovano i lotti L123 e L124","block":"Ritira i lotti","blocked":"Ritirati","notice":"Richiamo","recap":"Ritirati 552 vasetti: 264 del lotto L123 e 288 del lotto L124. Per i 24 vasetti già venduti parte il richiamo: un avviso a chi li ha comprati.","done":"Sfida superata ▶","events":["Ritiro al CeDi: lotti L123 e L124","Ritiro sul camion: i due cartoni, letti con il loro codice SSCC","Ritiro al supermercato di Milano","Ritiro al supermercato di Monza"],"fact":"Due ricerche nell'archivio e un ritiro per ogni luogo: 264 vasetti di L123 ritirati più 24 richiamati fanno 288, il lotto intero. Il lotto L124, fatto con lo stesso latte, si ferma prima ancora di uscire dal CeDi.","power":["Ritiro mirato","Solo i lotti coinvolti, e sai dove sono adesso. Secondi, non giorni."],"why":{"benefit":"Ritiri e richiami rapidi e mirati: si fermano solo i prodotti coinvolti e si avvisa chi li ha già comprati.","who":["produttore","distribuzione","consumatore","autorita"],"case":"Al Leeds Teaching Hospitals NHS Trust il tempo medio per ritirare un prodotto è sceso da 8,33 giorni a meno di 35 minuti. Il merito è degli standard GS1 del programma Scan4Safety.","source":"GS1 UK, «A scan of the benefits: the Scan4Safety evidence report», 2020"},"hint":"Parti dal latte, non dal lotto che conosci. Poi cerca quei lotti, ovunque siano.","sceneDesc":"Scena: la mappa della filiera. Nella seconda prova si accendono solo i luoghi dove si trovano i lotti L123 e L124.","q1Ctx":"Nell'archivio ci sono tutti gli eventi registrati dalle aziende della filiera: trasformazioni, spedizioni, ricevimenti, vendite. Puoi cercare, per esempio, per lotto o per luogo. Per ora sai solo che il latte della cisterna C0471 ha un problema.","q2Ctx":"La ricerca ha trovato due lotti di yogurt fatti con il latte C0471: L123 e L124. Alcuni vasetti sono in magazzino, altri in viaggio, altri a scaffale, altri già venduti. Il ritiro toglie il prodotto dalla filiera; il richiamo avvisa chi lo ha già comprato.","glossary":[["Archivio degli eventi","Il sistema dove si salvano gli eventi EPCIS e dove le aziende della filiera li cercano."],["Ricerca","Una domanda all'archivio: quali eventi riguardano questo lotto, questo luogo, questo periodo?"],["Ritiro","Si toglie il prodotto dalla filiera prima che arrivi a chi compra: magazzini, camion, scaffali. Riguarda le aziende."],["Richiamo","Si avvisa chi ha già comprato il prodotto di non consumarlo e di riportarlo. Riguarda chi compra."]]},"food-consumatore":{"meta":{"t":"Il consumatore inquadra il QR","c":"GS1 Digital Link e reso del lotto richiamato","place":"Casa e supermercato di Milano","short":"Consumatore"},"intro":"Ultima tappa. Un vasetto del lotto L123 è già sul tavolo di casa di qualcuno. Sopra c'è un QR code GS1: che cosa succede quando lo inquadra?","story":"Prima del ritiro, ventiquattro vasetti del lotto L123 sono stati venduti. Una persona ne ha uno a casa e inquadra il QR code con lo smartphone.","cap":"Lotto L123 · QR code GS1","scanNote":"Il QR code è vero: inquadralo anche tu con lo smartphone.","q":"Che cosa c'è dentro il QR code GS1 del vasetto?","qCtx":"Il QR code contiene un indirizzo web. Leggilo con calma: dopo il dominio ci sono dei numeri tra due barre, e una parte dopo il punto interrogativo.","opts":[{"t":"Solo il codice del prodotto, come nel codice a barre di sempre","why":"Il codice a barre classico porta solo il GTIN. Il QR code GS1 può portare anche lotto e data."},{"t":"Un GS1 Digital Link: un indirizzo web con il codice del prodotto, il lotto e la data","ok":true,"why":"Proprio così. Lo legge la cassa del negozio e lo apre lo smartphone: un solo codice per tutti e due."},{"t":"Tutti gli eventi EPCIS del lotto, scritti dentro il codice","why":"Gli eventi restano negli archivi delle aziende. Il QR code porta il link: è la pagina a mostrare la storia, presa dagli eventi."},{"t":"Un codice inventato dal supermercato, valido solo nel suo negozio","why":"I codici GS1 valgono ovunque: lo stesso QR code funziona in ogni negozio e in ogni Paese."}],"linkTitle":"Il link del QR code, pezzo per pezzo","q2Ctx":"La pagina del vasetto dice in rosso: lotto L123 richiamato, non mangiarlo e riportalo dove l'hai comprato. La persona torna al supermercato di Milano con il vasetto.","q2":"Il supermercato riprende il vasetto. Che cosa registra?","opts2":[{"t":"Niente: butta via il vasetto, il richiamo è già nell'archivio","why":"Senza un nuovo evento il caseificio non sa quanti vasetti richiamati sono davvero tornati."},{"t":"Un evento di oggetto: un vasetto del lotto L123, passo receiving, stato returned","ok":true,"why":"Esatto. L'evento dice che cosa è tornato, dove, quando e in che stato. Il richiamo si chiude con i numeri giusti."},{"t":"Niente: l'evento lo registra la persona, dal suo smartphone","why":"Chi compra legge le informazioni, non scrive eventi. L'evento lo registra il negozio che riprende il vasetto."},{"t":"Cancella dall'archivio gli eventi del lotto L123, che ormai è richiamato","why":"Negli archivi EPCIS non si cancella nulla. La storia del lotto resta, e si aggiunge una pagina nuova."}],"events":["Reso al supermercato di Milano: un vasetto del lotto L123 richiamato torna indietro"],"fact":"Una pagina sola: un evento di oggetto con lo stato returned. Il resto lo ha fatto il QR code, con GTIN, lotto e data in un unico link.","power":["Filo diretto","Dal QR code del vasetto alla storia del lotto: chi compra sa subito se il suo prodotto è richiamato."],"why":{"benefit":"Chi compra scopre subito se il suo vasetto è richiamato, senza aspettare i cartelli in negozio. L'azienda sa quanti vasetti tornano indietro.","who":["consumatore","produttore","distribuzione"]},"hint":"Guarda il link del QR code: quanti codici GS1 riconosci, tra una barra e l'altra?","sceneDesc":"Scena: un vasetto di yogurt con il suo QR code GS1, uno smartphone che lo inquadra e il supermercato di Milano.","glossary":[["QR code GS1","Un codice quadrato che contiene un GS1 Digital Link. Lo legge la cassa e lo apre lo smartphone."],["GS1 Digital Link","Un indirizzo web che porta i codici GS1: per esempio prodotto, lotto e data."],["Richiamo","L'avviso a chi ha già comprato un prodotto: non usarlo e riportalo."],["Reso","Il prodotto che torna indietro al negozio. Il negozio lo registra con un evento."]]}}`),codex:{heading:`Glossario del gioco`,sub:`Le voci si sbloccano giocando: {n} su {total} trovate.`,locked:`Da scoprire`,lockedText:`Gioca la tappa {id} per sbloccare questa voce.`,example:`Nel gioco`,useful:`Nella vita reale`,back:`Torna alla mappa`,cards:[{id:`epcis`,unlock:`food-stalla`,t:`EPCIS`,def:`Electronic Product Code Information Services: lo standard GS1 per registrare e condividere gli eventi di un prodotto.`,ex:`Ogni pagina del diario del lotto L123 è un evento EPCIS.`,use:`Fa parlare i sistemi di produttori, logistica e negozi con un linguaggio comune.`},{id:`object`,unlock:`food-stalla`,t:`Evento di oggetto`,def:`Evento che racconta un fatto su un prodotto o su un lotto: nasce, viene controllato, parte, arriva.`,ex:`Il lotto di latte C0471 nasce alla stalla e arriva al caseificio.`,use:`Seguire ogni lotto passo dopo passo, dalla materia prima in poi.`},{id:`transformation`,unlock:`food-latte`,t:`Evento di trasformazione`,def:`Evento in cui dei
